# gr::recipes::KissServe, a record chain served over a raw TCP byte stream.
#
# The chain is KissEncode, DelimiterFramer(slip), DataSetToStream<u8> and TcpByteSink. The recipe is a KISS server. It
# matches `KissFileWrite` with the file replaced by a socket. It writes the same SLIP-framed byte stream to a peer
# instead of a path. `TcpByteSink` carries the raw byte stream with no envelope, no framing and no interpretation. The
# recipe writes no versioned packet envelope, and a peer receives none.
#
# The SLIP profile is spelled out as in `KissFileWrite`. The profile has these settings.
#
#   end delimiter    0xC0 ("11000000", MSB first)
#   escaping         byte escaping
#   introducer       0xDB (219)
#   map              {0xDC (220) -> 0xC0 (192), 0xDD (221) -> 0xDB (219)}
#   bits per item    8
#
# `endpoint` and `queue_bytes` are `TcpByteSink`'s own required settings. The recipe forwards them with no default of
# its own. An endpoint nobody stated binds to nothing. A queue with no bound is not a bound. `bind` keeps the sink's own
# default of true, as a KISS server normally listens. `overflow` is exported with the sink's own default. The two
# values differ in kind for a framed stream. `drop_oldest` drops bytes from the middle of a frame. SLIP resynchronizes
# after the gap, and that frame is lost. `backpressure` stalls the chain instead and loses nothing. A server that must
# not lose frames sets `backpressure`. A server that must not stall keeps `drop_oldest`. The recipe makes neither
# choice. `kiss_port` and `emit_timestamp` belong to `KissEncode`, as in `KissFileWrite`.
definition_metadata:
  block_type: gr::recipes::KissServe
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: kiss_serve
    exported_parameters:
      - name: endpoint
        type: string
        doc: "'host:port' address, such as 127.0.0.1:5555 or [::1]:5555 (required)"
      - name: bind
        type: bool
        default: !!bool true
        doc: "listen on the endpoint (true) or connect to it (false)"
      - name: overflow
        type: string
        default: "drop_oldest"
        doc: "full-queue policy, 'drop_oldest' or 'backpressure'"
      - name: queue_bytes
        type: uint32
        doc: "bound of the in-process byte queue (required)"
      - name: kiss_port
        type: uint32
        default: !!uint32 0
        doc: "terminal node controller port of a frame, 0 to 15"
      - name: emit_timestamp
        type: bool
        default: !!bool false
        doc: "publish a command-9 frame before each data frame with a non-zero timestamp"
    graph:
      blocks:
        - id: "gr::blocks::ax25::KissEncode"
          parameters:
            name: kiss
            kiss_port: "=kiss_port"
            emit_timestamp: "=emit_timestamp"
        - id: "gr::blocks::digital::DelimiterFramer"
          parameters:
            name: framer
            end_delimiter: "11000000"
            transparency: "byte_escape"
            escape_item: !!uint32 219
            escape_map: !!uint32 [220, 192, 221, 219]
            bits_per_item: !!uint32 8
            max_payload_items: !!uint32 4096
        - id: "gr::blocks::basic::DataSetToStream<uint8>"
          parameters:
            name: flatten
        - id: "gr::blocks::network::TcpByteSink"
          parameters:
            name: tcp
            endpoint: "=endpoint"
            bind: "=bind"
            overflow: "=overflow"
            queue_bytes: "=queue_bytes"
      connections:
        - [kiss, 0, framer, 0]
        - [framer, 0, flatten, 0]
        - [flatten, 0, tcp, 0]
      exported_ports:
        - [kiss, INPUT, in, in]
