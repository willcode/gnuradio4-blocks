# gr::recipes::HdlcDeframe, sliced symbols in and validated frames out.
#
# The chain is DifferentialDecoder<u8>(nrzi), DelimiterExtractor<u8>(hdlc) and CrcCheck(CRC-16/IBM-SDLC). The recipe
# holds three blocks and three constants and adds no new arithmetic. It keeps the constants consistent with each other.
# A hand-built chain most often goes wrong there.
#
# ISO/IEC 13239 sets the constants. It frames with the flag 01111110. It keeps the flag out of the payload by inserting
# a zero after five consecutive ones. It abandons a frame on seven ones. The extractor therefore runs at one bit an
# item, with bit stuffing at five and abort at seven. The frame check sequence is the same standard's 16-bit CRC. That
# CRC is poly 0x1021 with both reflections, and seed and final XOR 0xFFFF. Its two octets go least significant first on
# the wire, which is `crc_byte_order: little`. AX.25, synchronous PPP and the AIS VHF data link of ITU-R M.1371 Annex 2
# all use exactly this framing and this frame check. The recipe serves all three.
#
# The line code is NRZI, and the HDLC radio links above use it. A zero bit is a transition and a one bit is none. The
# receiver needs no absolute polarity. `coding` also accepts the block's other value, `differential`, for a link coded
# the other way round.
#
# `payload_bit_order` sets the order in which the pack stage assembles a de-stuffed octet. HDLC transmits each octet
# least significant bit first. That is the default here, and AX.25 uses it. A protocol whose parser reads the frame as
# one bit string, most significant bit first, sets `MsbFirst`. The choice belongs to that parser and not to the
# framing. It is therefore a parameter.
#
# `max_payload_items` is the bound the extractor's contract requires, and the contract gives it no default. Without
# it, a frame whose closing flag is corrupted grows with the stream. The recipe takes the bound in payload octets. A
# caller of a byte protocol knows octets. The recipe passes eight times the value to the extractor. The extractor
# counts the decoded items it scans, and an HDLC stream carries one bit per item. `min_payload_items` is fixed at 24
# items, or three octets. That is the smallest region that can hold a frame check and one payload octet. A shorter
# region leaves by `reject` as undersize and does not reach a check too short to read.
#
# Both failure ports are exported. A discarded region leaves by a port with its reason. `reject` carries the
# extractor's overrun, undersize and unaligned regions. `fail` carries the frames whose check sequence disagreed.
# Hiding either port inside the composite would hide the reason.
definition_metadata:
  block_type: gr::recipes::HdlcDeframe
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: hdlc_deframe
    exported_parameters:
      - name: max_payload_items
        type: uint32
        doc: "largest payload a frame may carry, in octets (required)"
      - name: coding
        type: string
        default: "nrzi"
        doc: "line code ahead of the framing, 'nrzi' or 'differential'"
      - name: payload_bit_order
        type: string
        default: "LsbFirst"
        doc: "order the pack stage assembles a de-stuffed octet in"
    graph:
      blocks:
        - id: "gr::blocks::digital::DifferentialDecoder<uint8>"
          parameters:
            name: line_code
            coding: "=coding"
        - id: "gr::blocks::digital::DelimiterExtractor<uint8>"
          parameters:
            name: extractor
            end_delimiter: "01111110"
            transparency: "bit_stuffing"
            stuff_after_ones: !!uint32 5
            abort_ones: !!uint32 7
            bits_per_item: !!uint32 1
            max_payload_items: "=max_payload_items * 8" # the extractor counts bit items, the parameter counts octets
            min_payload_items: !!uint32 24 # three octets in bit items. A shorter region cannot hold a check sequence and a payload octet
            payload_pack_bits: !!uint32 8
            payload_bit_order: "=payload_bit_order"
            frame_label: "hdlc"
        - id: "gr::blocks::digital::CrcCheck"
          parameters:
            name: check
            width: !!uint32 16
            poly: !!uint64 4129 # 0x1021
            initial_value: !!uint64 65535
            final_xor: !!uint64 65535
            input_reflected: !!bool true
            result_reflected: !!bool true
            crc_byte_order: "little"
            discard_crc: !!bool true
      connections:
        - [line_code, 0, extractor, 0]
        - [extractor, 0, check, 0]
      exported_ports:
        - [line_code, INPUT, in, in]
        - [check, OUTPUT, ok, out]
        - [check, OUTPUT, fail, fail]
        - [extractor, OUTPUT, reject, reject]
