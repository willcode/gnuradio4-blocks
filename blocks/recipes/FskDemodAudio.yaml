# gr::recipes::FskDemodAudio, two-level FSK from a stream that is already a discriminator's output.
#
# The recipe takes audio. A communications receiver's FM detector delivers the instantaneous frequency of the signal.
# A sound card recording of that detector holds the same. `FskDemod`'s discriminator produces the same stream. This
# recipe is therefore `FskDemod`'s tail alone. It runs the post-detection lowpass, timing recovery and the slicer. It is
# a sibling recipe and not a parameter. It drops two blocks, and the recipe dialect has no conditionals.
#
# The recipe derives `FskDemod`'s values without the discriminator gain. That gain belongs to the detector that
# produced the stream.
#
#   post-detection cutoff = lowpass_bandwidth * symbol_rate, transition half of it
#   samples per symbol    = sample_rate / symbol_rate
#
# The recipe has no `modulation_index` and no deviation. The detector that produced the stream applied a gain to
# map the phase advance onto the PAM grid. The recipe cannot know that scale. The input therefore arrives at an
# arbitrary amplitude. At two levels the amplitude does not matter. `PamSlicer` puts the single threshold of a
# two-level grid at zero. The decision is the sign of the sample. Any positive scaling of the input gives the same
# labels.
#
# The polarity is the source's. A detector whose higher tone carries the zero delivers this stream inverted. A receiver
# of that link inverts the stream back, or its framing layer resolves the inversion. This recipe cannot detect the
# inversion. The tone pair is not visible in a stream that is already detected.
#
# This recipe does not remove a DC offset. A residual carrier offset at the detector adds a constant to every sample.
# Past half a level every symbol is decided wrong. `FskDemodDcBlock` removes the offset, and it needs the discriminator
# this recipe lacks. A link with a frequency error blocks DC ahead of this recipe or stays inside the margin.
#
# `lowpass_bandwidth` defaults to 0.5. That is the noise-optimal post-detection cutoff and not the timing-optimal one.
# A Gardner or Mueller-and-Muller detector tracks the spectral component at the symbol rate. The amplitude of that
# component is the overlap of the received pulse's spectrum with itself shifted by Rs. It comes entirely from energy
# above Rs/2. A cutoff at exactly Rs/2 with a transition of Rs/4 leaves the loop a narrow slice of transition band. For
# this 65-tap design the overlap integral is normalized by the filter's energy. It is 0.000 at a cutoff of 0.40 Rs,
# 0.032 at 0.50 and 0.347 at 0.75. A weak capture whose timing loop does not lock is worth reading again at 0.75. The
# wider cutoff passes more noise and a stronger timing line. The choice belongs to the link. The default is the
# conventional cutoff.
#
# 9600-baud G3RUH packet radio is the largest population this recipe serves. It is worked through here as an example,
# and its values are not the defaults. 9600 Bd from a 48 kHz recording is exactly five samples per symbol. The
# post-detection cutoff is then 4800 Hz. The scrambler and the framing that follow belong to the caller. `sample_rate`
# and `symbol_rate` are required. A general recipe requires the values every link differs in.
#
# The input is a detected real stream at sample_rate. The output is one label per symbol.
definition_metadata:
  block_type: gr::recipes::FskDemodAudio
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: fsk_demod_audio
    exported_parameters:
      - name: sample_rate
        type: float32
        doc: "input sample rate in hertz (required)"
      - name: symbol_rate
        type: float32
        doc: "symbol rate in hertz (required)"
      - name: lowpass_bandwidth
        type: float64
        default: !!float64 0.5
        doc: "post-detection lowpass cutoff in multiples of the symbol rate"
      - name: noise_bandwidth
        type: float64
        default: !!float64 0.002
        doc: "closed-loop noise bandwidth of the timing recovery, normalized to the symbol rate"
      - name: detector
        type: string
        default: "MuellerMuller"
        doc: "timing error detector: MuellerMuller, ModifiedMuellerMuller, ZeroCrossing, Gardner, EarlyLate, SignalTimesSlopeMl or SignumTimesSlopeMl"
    graph:
      blocks:
        - id: "gr::blocks::filter::DesignedFilter<float32, float32>"
          parameters:
            name: lowpass
            profile: "lowpass"
            sample_rate: "=sample_rate"
            cutoff: "=lowpass_bandwidth * symbol_rate"
            transition_width: "=0.5 * lowpass_bandwidth * symbol_rate"
        - id: "gr::blocks::sync::SymbolSync<float32>"
          parameters:
            name: timing
            samples_per_symbol: "=sample_rate / symbol_rate"
            noise_bandwidth: "=noise_bandwidth"
            detector: "=detector"
        - id: "gr::blocks::digital::PamSlicer<float32>"
          parameters:
            name: slicer
            n_levels: !!uint32 2
      connections:
        - [lowpass, 0, timing, 0]
        - [timing, 0, slicer, 0]
      exported_ports:
        - [lowpass, INPUT, in, in]
        - [slicer, OUTPUT, out, out]
