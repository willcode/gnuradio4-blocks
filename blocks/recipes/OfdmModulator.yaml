# gr::recipes::OfdmModulator, the transmit half of an OFDM link from data-carrier symbols to baseband.
#
# The recipe holds a numerology and no derivation. Four blocks in an OFDM chain must agree on the transform length, the
# carrier sets, the pilot cycle and the sync words. A graph does not check that agreement. A chain assembled by hand
# can differ between transmitter and receiver in any one of them and still run. Its stream then carries nothing. This
# composite states the numerology once, as its own settings. That makes the mismatch impossible on the transmit side.
# On the receive side it reduces the mismatch to one copied parameter block.
#
# The input is post-encoder data-carrier symbols. The output is complex baseband. The allocator maps the symbols onto
# OFDM symbols in FFT bin order. The prefix block takes the inverse transform and puts each symbol's tail in front of
# it. Pilot p of the symbol with data index s in its frame reads entry (s * n_pilots + p) % len of `pilot_symbols`.
# `sync_words` holds a whole number of fft_len-carrier symbols.
#
# cp_len is a scalar or a per-symbol cycle. The cycle position restarts at every frame. 802.11's long-then-short
# opening is written that way. window_len raised-cosine samples smooth the symbol edges into each other. Windowing is
# off by default, as it departs from the exact prefix algebra. Its benefit is a narrower spectrum, and a user turns it
# on for that benefit. The measured shoulder is 4.0, 14.9 and 28.9 dB for 4, 8 and 16 samples, over 24 occupied
# carriers of 64.
#
# The frame-start trigger the prefix block can write is off here. That trigger is a transmit-side marker for a loopback
# with no detector. A receiver with a real sync block would see two triggers for one frame and restart on the second.
#
# Every parameter but window_len is required. A numerology has no meaningful default. A receiver built against a
# guessed numerology decodes noise.
definition_metadata:
  block_type: gr::recipes::OfdmModulator
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: ofdm_modulator
    exported_parameters:
      - name: fft_len
        type: uint32
        doc: "transform length and carriers per symbol, a power of two (required)"
      - name: data_carriers
        type: int32[]
        doc: "signed logical carrier indices the data stream fills, in order (required)"
      - name: pilot_carriers
        type: int32[]
        doc: "signed logical carrier indices of the pilot cycle, possibly empty (required)"
      - name: pilot_symbols
        type: float32[]
        doc: "pilot values as interleaved re,im (required)"
      - name: sync_words
        type: float32[]
        doc: "sync symbols as interleaved re,im, sent verbatim at each frame's head (required)"
      - name: frame_len
        type: uint32
        doc: "data symbols per frame (required)"
      - name: cp_len
        type: uint32[]
        doc: "prefix samples, a constant or a per-symbol cycle (required)"
      - name: window_len
        type: uint32
        default: !!uint32 0
        doc: "raised-cosine edge samples overlapped with the next symbol, 0 for off"
    graph:
      blocks:
        - id: "gr::blocks::ofdm::CarrierAllocator"
          parameters:
            name: allocator
            fft_len: "=fft_len"
            data_carriers: "=data_carriers"
            pilot_carriers: "=pilot_carriers"
            pilot_symbols: "=pilot_symbols"
            sync_words: "=sync_words"
            frame_len: "=frame_len"
        - id: "gr::blocks::ofdm::CpInsert"
          parameters:
            name: prefix
            cp_len: "=cp_len"
            window_len: "=window_len"
            emit_trigger: false
      connections:
        - [allocator, 0, prefix, 0]
      exported_ports:
        - [allocator, INPUT, in, in]
        - [prefix, OUTPUT, out, out]
