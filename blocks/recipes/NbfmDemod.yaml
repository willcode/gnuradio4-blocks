# gr::recipes::NbfmDemod, narrow-band FM demodulation in general form.
#
# The recipe derives the discriminator gain. An FM discriminator's gain must be sample_rate / (2·pi·deviation). The
# de-emphasis constant is evaluated at the same rate. sample_rate and deviation have no defaults by design. A general
# recipe requires them. A defaulted rate hides behavior from a user unaware of the parameter, and it is usually wrong.
# A PTT radio and a broadcast differ in exactly these two values. A recipe built for one service is the place for
# defaults that are normal values. The input is complex baseband at sample_rate. The output is demodulated float audio
# at the same rate. Resample it to the sink's rate after the recipe.
definition_metadata:
  block_type: gr::recipes::NbfmDemod
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-08-28"
blocks:
  - id: SUBGRAPH
    parameters:
      name: nbfm_demod
    exported_parameters:
      - name: sample_rate
        type: float32
        doc: "channel sample rate in hertz (required)"
      - name: deviation
        type: float32
        doc: "nominal FM deviation in hertz (required)"
      - name: tau
        type: float64
        default: !!float64 7.5e-05
        doc: "de-emphasis time constant in seconds, commonly 75 us for narrow band"
    graph:
      blocks:
        - id: "gr::blocks::analog::QuadratureDemod<float32>"
          parameters:
            name: discriminator
            gain: "=sample_rate / (2 * pi * deviation)"
        - id: "gr::blocks::analog::FmDeemphasis<float32>"
          parameters:
            name: deemphasis
            sample_rate: "=sample_rate"
            tau: "=tau"
      connections:
        - [discriminator, 0, deemphasis, 0]
      exported_ports:
        - [discriminator, INPUT, in, in]
        - [deemphasis, OUTPUT, out, out]
