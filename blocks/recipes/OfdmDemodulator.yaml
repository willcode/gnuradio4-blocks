# gr::recipes::OfdmDemodulator, the receive half of an OFDM link from baseband to equalized carriers.
#
# The recipe states the receive numerology once, as OfdmModulator does for the transmit side. The sync block, the
# prefix removal and the equalizer all read the same numerology. A graph does not make three settings agree.
#
# The input is complex baseband. The output is the equalized data carriers, one record per symbol, in data_carriers
# order. A constellation decoder can take that output directly. The optional channel port carries the least-squares
# estimate as magnitude and phase against the carrier axis.
#
# The chain is the sync block, prefix removal and the equalizer. The sync block finds each frame from a repeated-half
# preamble. It writes a trigger at the frame's first sample, which is the first sample of the preamble's own prefix.
# The fractional carrier offset goes beside the trigger, and the sync block derotates the stream by that offset. Prefix
# removal cuts on the trigger and takes the forward transform. The equalizer divides by the channel that the frame's
# known sync word measures. Between frames it tracks the channel through the pilots. Pilot p of the symbol with data
# index s in its frame reads entry (s * n_pilots + p) % len of `pilot_symbols`. A Schmidl-Cox preamble occupies even
# carriers only. It cannot be the known symbol that `sync_index` names.
#
# The recipe has two prefix settings. cp_len is the frame's whole cycle, and prefix removal walks it. The sync block
# reads the preamble's own prefix alone. That prefix sets the width of the correlation plateau. It also sets the offset
# from the plateau's midpoint back to the frame's first sample. In a numerology with a constant prefix the two are the
# same number. Otherwise preamble_cp_len is cp_len's first entry.
#
# timing_offset moves the cut into the prefix. It has to cover two things. The first is the channel's delay spread. The
# transform window must hold no energy from the previous symbol. The second is the residual of the sync's plateau
# midpoint. That residual is a property of the preamble sequence, and it is measured and not derived. The offset
# rotates signed carrier k by 2*pi*k*timing_offset/fft_len. The least-squares estimate absorbs that rotation along with
# the channel.
#
# r_floor is the received energy below which the timing metric's ratio is meaningless. It therefore depends on scale.
# A link is tuned around a quarter of the energy that a correlation window of fft_len/2 samples holds during the
# preamble. Set it from the link's own level. The default only keeps a silent input from triggering.
#
# min_gap is the dead time after a trigger. Its default of one symbol is enough, as a frame's own length keeps one
# frame from being detected twice.
definition_metadata:
  block_type: gr::recipes::OfdmDemodulator
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: ofdm_demodulator
    exported_parameters:
      - name: fft_len
        type: uint32
        doc: "transform length and carriers per symbol, a power of two (required)"
      - name: data_carriers
        type: int32[]
        doc: "signed logical carrier indices the output holds, in order (required)"
      - name: pilot_carriers
        type: int32[]
        doc: "signed logical carrier indices the tracking reads (required)"
      - name: pilot_symbols
        type: float32[]
        doc: "pilot values as interleaved re,im (required)"
      - name: sync_word
        type: float32[]
        doc: "known sync symbol as interleaved re,im, one fft_len symbol (required)"
      - name: n_sync
        type: uint32
        doc: "sync symbols at a frame's head, including the preamble (required)"
      - name: sync_index
        type: uint32
        default: !!uint32 1
        doc: "index of the known symbol among the sync symbols"
      - name: frame_len
        type: uint32
        doc: "data symbols per frame (required)"
      - name: cp_len
        type: uint32[]
        doc: "prefix samples per symbol in the transmitter's own cycle (required)"
      - name: preamble_cp_len
        type: uint32
        doc: "prefix length of the preamble symbol (required)"
      - name: timing_offset
        type: int32
        default: !!int32 0
        doc: "signed bias of the cut in [-min(cp_len), 0], negative inside the prefix"
      - name: threshold
        type: float32
        default: !!float32 0.6
        doc: "timing metric level that starts a preamble plateau, in (0, 1)"
      - name: r_floor
        type: float32
        default: !!float32 1.0e-9
        doc: "minimum received energy for a trigger"
      - name: min_gap
        type: uint32
        default: !!uint32 1
        doc: "dead time after a trigger, in symbols"
      - name: tracking
        type: string
        default: "cpe"
        doc: "'cpe', 'cpe_interp' or 'none'"
      - name: alpha
        type: float32
        default: !!float32 0.1
        doc: "single-pole coefficient of the per-carrier 'cpe_interp' update in (0, 1]"
    graph:
      blocks:
        - id: "gr::blocks::ofdm::SchmidlCoxSync"
          parameters:
            name: sync
            fft_len: "=fft_len"
            cp_len: "=preamble_cp_len"
            threshold: "=threshold"
            r_floor: "=r_floor"
            min_gap: "=min_gap"
        - id: "gr::blocks::ofdm::CpRemove"
          parameters:
            name: prefix
            fft_len: "=fft_len"
            cp_len: "=cp_len"
            n_sync: "=n_sync"
            frame_len: "=frame_len"
            timing_offset: "=timing_offset"
        - id: "gr::blocks::ofdm::OfdmChannelEqualizer"
          parameters:
            name: equalizer
            fft_len: "=fft_len"
            data_carriers: "=data_carriers"
            pilot_carriers: "=pilot_carriers"
            pilot_symbols: "=pilot_symbols"
            sync_word: "=sync_word"
            n_sync: "=n_sync"
            sync_index: "=sync_index"
            tracking: "=tracking"
            alpha: "=alpha"
      connections:
        - [sync, 0, prefix, 0]
        - [prefix, 0, equalizer, 0]
      exported_ports:
        - [sync, INPUT, in, in]
        - [equalizer, OUTPUT, out, out]
        - [equalizer, OUTPUT, channel, channel]
