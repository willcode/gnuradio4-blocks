# gr::recipes::SampleClockOffset, sampling-clock frequency error in parts per million.
#
# Two radios differ slightly in sample rate. A receiver whose clock runs `ppm` parts per million fast reads the
# transmitter's stream slightly compressed in time. That appears as a symbol-timing drift, and a recovery loop has to
# track it. The model is a resampling by 1 + ppm*1e-6. Positive ppm produces more output samples than input samples.
# That is the convention for a receiver clock that runs fast.
#
# The derivation is small, and the machinery behind it is not. A rate change has to re-origin tags. A tag's sample
# offset means something different on either side of a resampler. ArbitraryRateResampler re-origins tags. Its
# fixed-point phase realizes an exact ratio that does not drift. Expressing the impairment as a rate keeps all of this
# in one block.
#
# The input and output are complex baseband. The realized ratio is one the resampler's fixed-point step can represent.
# For the small offsets this recipe models, that ratio matches the requested one to well past the precision of a clock
# specification.
definition_metadata:
  block_type: gr::recipes::SampleClockOffset
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-08-31"
blocks:
  - id: SUBGRAPH
    parameters:
      name: sample_clock_offset
    exported_parameters:
      - name: ppm
        type: float64
        default: !!float64 0.0
        doc: "clock error in parts per million, positive for a fast clock"
      - name: attenuation_db
        type: float32
        default: !!float32 60.0
        doc: "stopband target sizing the resampler's prototype and polyphase bank"
    graph:
      blocks:
        - id: "gr::blocks::filter::ArbitraryRateResampler<complex<float32>>"
          parameters:
            name: clock
            rate: "=1 + ppm * 1e-6"
            attenuation_db: "=attenuation_db"
      connections: []
      exported_ports:
        - [clock, INPUT, in, in]
        - [clock, OUTPUT, out, out]
