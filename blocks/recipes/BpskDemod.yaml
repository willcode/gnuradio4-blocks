# gr::recipes::BpskDemod, coherent BPSK demodulation.
#
# The recipe runs BpskFrontEnd's five stages, a Costas loop and the real part. The front end delivers one complex
# sample per symbol. The residual carrier frequency is removed, and the carrier phase is still on the sample. The Costas
# loop removes the phase. The constellation then lies on the real axis, and the real part is the soft decision.
#
# `order` is written as a literal 2 and is not exported. A BPSK recipe with a settable order is a PSK recipe. That is a
# different name, a different set of parameters and a different test. `detector_gain` is written as a
# literal 1.0 and is not left at the block's default. 1.0 is the slope of the order-2 detector's S-curve at unit
# amplitude. BpskFrontEnd's AGC delivers unit amplitude. The number is chosen and not inherited.
#
# A Costas loop of order 2 has a 180-degree phase ambiguity. The recovered symbol stream may be the transmitted one
# inverted. A sync word or differential encoding resolves the ambiguity at the framing level. This recipe leaves it
# unresolved. The sibling recipe DbpskDemod needs no carrier phase.
#
# The parameters are BpskFrontEnd's plus the carrier loop's own bandwidth. The five front-end stages are written out in
# this file as the same blocks BpskFrontEnd holds.
#
# Timing recovery runs before carrier recovery. The timing detector must therefore need no decision.
#
# The gain control's time constants are in symbol periods, and the recipe divides them by `symbol_rate`. A gain loop
# that reads the instantaneous magnitude follows the modulation's own envelope. Its time constant must be long against
# a symbol to avoid that. The decay constant is twice the attack by default. The gain rises half as fast as it falls.
#
# The input is complex baseband at sample_rate. The output is one soft symbol per symbol.
definition_metadata:
  block_type: gr::recipes::BpskDemod
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: bpsk_demod
    exported_parameters:
      - name: sample_rate
        type: float32
        doc: "input sample rate in hertz (required)"
      - name: symbol_rate
        type: float32
        doc: "symbol rate in hertz (required)"
      - name: frequency_offset
        type: float64
        default: !!float64 0.0
        doc: "carrier offset from the front end's center in hertz"
      - name: decimation
        type: uint32
        default: !!uint32 1
        doc: "channel filter decimation, chosen for about four samples per symbol"
      - name: channel_bandwidth
        type: float64
        default: !!float64 0.75
        doc: "cutoff of the channel filter as a multiple of the symbol rate"
      - name: rolloff
        type: float64
        default: !!float64 0.35
        doc: "excess bandwidth of the transmit shaping filter, in [0, 1]"
      - name: fll_noise_bandwidth
        type: float64
        default: !!float64 0.01
        doc: "frequency-locked loop noise bandwidth in Bn*T per sample"
      - name: fll_filter_length
        type: uint32
        default: !!uint32 45
        doc: "taps in each band-edge filter"
      - name: timing_detector
        type: string
        default: "Gardner"
        doc: "timing error detector, one of Gardner, ZeroCrossing or EarlyLate"
      - name: timing_noise_bandwidth
        type: float64
        default: !!float64 0.002
        doc: "closed-loop noise bandwidth of the timing recovery, normalized to the symbol rate"
      - name: costas_noise_bandwidth
        type: float64
        default: !!float64 0.01
        doc: "carrier phase loop noise bandwidth, normalized to the symbol rate"
      - name: agc_reference_db
        type: float64
        default: !!float64 0.0
        doc: "target output level of the front end's AGC, in decibels"
      - name: agc_attack_symbols
        type: float64
        default: !!float64 256.0
        doc: "gain-control time constant while the gain falls, in symbol periods"
      - name: agc_decay_symbols
        type: float64
        default: !!float64 512.0
        doc: "gain-control time constant while the gain rises, in symbol periods"
    graph:
      blocks:
        - id: "gr::blocks::math::Rotator<complex<float32>>"
          parameters:
            name: translate
            sample_rate: "=sample_rate"
            frequency_shift: "=-frequency_offset"
        - id: "gr::blocks::filter::DesignedFilter<complex<float32>, float32>"
          parameters:
            name: channel
            profile: "lowpass"
            sample_rate: "=sample_rate"
            cutoff: "=channel_bandwidth * symbol_rate"
            transition_width: "=0.5 * channel_bandwidth * symbol_rate"
            decimation: "=decimation"
        - id: "gr::blocks::analog::Agc<complex<float32>>"
          parameters:
            name: agc
            sample_rate: "=sample_rate / decimation"
            reference_db: "=agc_reference_db"
            attack_s: "=agc_attack_symbols / symbol_rate"
            decay_s: "=agc_decay_symbols / symbol_rate"
        - id: "gr::blocks::sync::FllBandEdge"
          parameters:
            name: fll
            samples_per_symbol: "=sample_rate / (decimation * symbol_rate)"
            rolloff: "=rolloff"
            filter_length: "=fll_filter_length"
            noise_bandwidth: "=fll_noise_bandwidth"
        - id: "gr::blocks::sync::SymbolSync<complex<float32>>"
          parameters:
            name: timing
            samples_per_symbol: "=sample_rate / (decimation * symbol_rate)"
            rolloff: "=rolloff"
            noise_bandwidth: "=timing_noise_bandwidth"
            detector: "=timing_detector"
            constellation: "bpsk"
        - id: "gr::blocks::sync::CostasLoop"
          parameters:
            name: costas
            order: !!uint32 2
            detector_gain: !!float64 1.0
            noise_bandwidth: "=costas_noise_bandwidth"
        - id: "gr::blocks::basic::Real<complex<float32>>"
          parameters:
            name: decision
      connections:
        - [translate, 0, channel, 0]
        - [channel, 0, agc, 0]
        - [agc, 0, fll, 0]
        - [fll, 0, timing, 0]
        - [timing, 0, costas, 0]
        - [costas, 0, decision, 0]
      exported_ports:
        - [translate, INPUT, in, in]
        - [decision, OUTPUT, real, out]
