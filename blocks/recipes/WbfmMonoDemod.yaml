# gr::recipes::WbfmMonoDemod, mono broadcast FM from a wideband front end to audio.
#
# This recipe serves one service, unlike NbfmDemod. The numbers the service defines are therefore defaults. They are
# 75 kHz deviation, a 75 us de-emphasis and 48 kHz audio. The 75 us de-emphasis holds in the Americas and South Korea,
# and 50 us holds elsewhere. `sample_rate` alone is the user's own fact and is required. A defaulted rate would be
# wrong for every front end but one.
#
# The chain is a tuner, a decimating channel filter, the discriminator, the audio resampler and de-emphasis. A
# receiver runs them in this order.
#
# The recipe derives these values.
#
#   channel_rate           = sample_rate / channel_decimation, the discriminator's rate
#   discriminator gain     = channel_rate / (2*pi*deviation), for full deviation at +-1.0
#   audio resampling ratio = audio_rate / channel_rate
#
# The recipe cannot know `channel_decimation`. It depends on the front end's rate. Pick it for a channel rate between
# about 200 and 400 kHz. 240 kHz is the usual choice. The default of 1 means the input is already a channel at that
# rate. StagedDecimator's passband is a fraction of its output rate and not a frequency. The channel filter therefore
# follows `channel_decimation` with no second setting to keep in step. At its default width of 0.8 it keeps
# +-0.4*channel_rate. At 240 kHz that is +-96 kHz, which passes Carson's 2*(75+15) = 180 kHz for mono. At
# `channel_decimation` = 1 the block designs no taps and passes the input through bit-exact. An input already at the
# channel rate needs no more filtering.
#
# A recipe has no conditionals. The tuner is in the chain at every setting. `offset_hz` defaults to 0. At 0 the
# rotator's phase increment is zero, and it copies its input. A listener tuned off the station's center sets the
# offset instead of retuning the radio.
#
# The audio stage is ArbitraryRateResampler and not RationalResampler. The ratio depends on the front end. The dialect
# has no gcd and no integer division. A rational form would need L and M exported already reduced. The user would then
# have to keep them consistent with three rates. One real ratio is the right form here. Some ratios are a fraction of
# small terms, such as 240 kHz to 48 kHz at 1/5. A user with such a ratio halves the arithmetic by using
# RationalResampler in a copy of this file.
#
# De-emphasis runs last, at the audio rate. A broadcast receiver runs it in this order. The block's own response
# figures are quoted at that rate. `tau` = 0 bypasses it.
#
# The input is complex baseband at sample_rate. The output is mono float audio at audio_rate.
definition_metadata:
  block_type: gr::recipes::WbfmMonoDemod
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: wbfm_mono_demod
    exported_parameters:
      - name: sample_rate
        type: float32
        doc: "front-end sample rate in hertz (required)"
      - name: channel_decimation
        type: uint32
        default: !!uint32 1
        doc: "input samples per channel sample, 1 for a pass-through"
      - name: offset_hz
        type: float64
        default: !!float64 0.0
        doc: "station offset from center in hertz (0 leaves the tuner inert)"
      - name: deviation
        type: float32
        default: !!float32 75000.0
        doc: "peak FM deviation in hertz, 75 kHz for broadcast"
      - name: tau
        type: float64
        default: !!float64 7.5e-05
        doc: "de-emphasis time constant in seconds, 0 to bypass"
      - name: audio_rate
        type: float32
        default: !!float32 48000.0
        doc: "output audio sample rate in hertz"
    graph:
      blocks:
        - id: "gr::blocks::math::Rotator<complex<float32>>"
          parameters:
            name: tuner
            sample_rate: "=sample_rate"
            frequency_shift: "=-offset_hz"
        - id: "gr::blocks::filter::StagedDecimator<complex<float32>>"
          parameters:
            name: channel
            decimation: "=channel_decimation"
        - id: "gr::blocks::analog::QuadratureDemod<float32>"
          parameters:
            name: discriminator
            gain: "=sample_rate / (channel_decimation * 2 * pi * deviation)"
        - id: "gr::blocks::filter::ArbitraryRateResampler<float32>"
          parameters:
            name: audio
            rate: "=audio_rate * channel_decimation / sample_rate"
        - id: "gr::blocks::analog::FmDeemphasis<float32>"
          parameters:
            name: deemphasis
            sample_rate: "=audio_rate"
            tau: "=tau"
      connections:
        - [tuner, 0, channel, 0]
        - [channel, 0, discriminator, 0]
        - [discriminator, 0, audio, 0]
        - [audio, 0, deemphasis, 0]
      exported_ports:
        - [tuner, INPUT, in, in]
        - [deemphasis, OUTPUT, out, out]
