# gr::recipes::BpskFrontEnd, the five stages ahead of a BPSK detector.
#
# The stages are tuning, a channel filter with decimation, automatic gain control, a frequency-locked loop and timing
# recovery. The recipe ends at one complex sample per symbol. The coherent and the differential detector differ in
# what they do with that sample. The five stages are therefore a recipe of their own. The recipe runs on its own. It
# derives the five numbers below.
#
#   samples per symbol = sample_rate / (decimation * symbol_rate), at both loops
#   channel cutoff     = channel_bandwidth * symbol_rate
#   agc rate           = sample_rate / decimation
#
# A root-raised-cosine signal at excess bandwidth `rolloff` occupies (1 + rolloff) symbol rates two-sided. Half of
# that is (1 + rolloff)/2, or 0.675 at the default rolloff. The default `channel_bandwidth` of 0.75 keeps the filter's
# own transition band outside the signal. The AGC measures its time constants at the agc rate. The matched filter and
# the band-edge filters are both designed from `rolloff`.
#
# The gain control's time constants are counted in symbol periods. The Agc block takes seconds, and the recipe divides
# each constant by `symbol_rate`. The gain loop reads the instantaneous magnitude. A linearly modulated carrier passes
# through zero at every symbol transition. A time constant of a few symbols follows the modulation's envelope. The loop
# then writes that envelope back onto the stream as a multiplicative error, and no detector can remove it. The count
# of symbol periods is the same across links, and the time in seconds is not. The defaults of 256 and 512 symbols hold
# the level of every link measured through these recipes. Those links run from 400 baud Manchester off the air to 12.5
# kilobaud synthetic. No single figure in seconds holds them all. 5 ms is 62 symbols at 12.5 kBd and four chips at 800
# chips a second. The decay constant is twice the attack by default. The gain rises half as fast as it falls.
#
# The AGC is required. The gains of FllBandEdge's band-edge discriminant and CostasLoop's phase detector are
# proportional to input power. Both blocks state their detector gains at unit amplitude. `agc_reference_db` is
# therefore 0 here, and the Agc block's own default is -6. The front end delivers an amplitude of one.
#
# The timing detector must be non-data-aided. Timing recovery runs before any carrier recovery. The symbol it receives
# still carries the carrier phase. A decision-directed detector would slice a constellation whose phase is unknown.
# SymbolSync's own default, Mueller and Muller, is such a detector. At a carrier phase of 90 degrees it loses the loop
# entirely. `timing_detector` defaults to Gardner, which is non-data-aided and works at any phase. The three allowed
# choices are the three that need no decision.
#
# SymbolSync designs its own root-raised-cosine matched filter from `samples_per_symbol` and `rolloff` when it gets no
# taps. The recipe passes a rolloff and no tap vector.
#
# The input is complex baseband at sample_rate. The output is one complex sample per symbol at unit amplitude. The
# residual carrier frequency is removed. The carrier phase is left in place. Phase recovery belongs to the detector,
# and this recipe has none.
definition_metadata:
  block_type: gr::recipes::BpskFrontEnd
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: bpsk_front_end
    exported_parameters:
      - name: sample_rate
        type: float32
        doc: "input sample rate in hertz (required)"
      - name: symbol_rate
        type: float32
        doc: "symbol rate in hertz (required)"
      - name: frequency_offset
        type: float64
        default: !!float64 0.0
        doc: "carrier offset from center in hertz (0 leaves the tuner inert)"
      - name: decimation
        type: uint32
        default: !!uint32 1
        doc: "channel filter decimation giving about four samples per symbol"
      - name: channel_bandwidth
        type: float64
        default: !!float64 0.75
        doc: "cutoff of the channel filter as a multiple of the symbol rate"
      - name: rolloff
        type: float64
        default: !!float64 0.35
        doc: "excess bandwidth of the transmit shaping filter, in [0, 1]"
      - name: fll_noise_bandwidth
        type: float64
        default: !!float64 0.01
        doc: "frequency-locked loop noise bandwidth in Bn*T per sample"
      - name: fll_filter_length
        type: uint32
        default: !!uint32 45
        doc: "taps in each band-edge filter, useful from 30 to 70"
      - name: timing_detector
        type: string
        default: "Gardner"
        doc: "timing error detector, one of Gardner, ZeroCrossing or EarlyLate"
      - name: timing_noise_bandwidth
        type: float64
        default: !!float64 0.002
        doc: "closed-loop noise bandwidth of the timing recovery, normalized to the symbol rate"
      - name: agc_reference_db
        type: float64
        default: !!float64 0.0
        doc: "AGC target output level in decibels"
      - name: agc_attack_symbols
        type: float64
        default: !!float64 256.0
        doc: "gain-control time constant while the gain falls, in symbol periods"
      - name: agc_decay_symbols
        type: float64
        default: !!float64 512.0
        doc: "gain-control time constant while the gain rises, in symbol periods"
    graph:
      blocks:
        - id: "gr::blocks::math::Rotator<complex<float32>>"
          parameters:
            name: translate
            sample_rate: "=sample_rate"
            frequency_shift: "=-frequency_offset"
        - id: "gr::blocks::filter::DesignedFilter<complex<float32>, float32>"
          parameters:
            name: channel
            profile: "lowpass"
            sample_rate: "=sample_rate"
            cutoff: "=channel_bandwidth * symbol_rate"
            transition_width: "=0.5 * channel_bandwidth * symbol_rate"
            decimation: "=decimation"
        - id: "gr::blocks::analog::Agc<complex<float32>>"
          parameters:
            name: agc
            sample_rate: "=sample_rate / decimation"
            reference_db: "=agc_reference_db"
            attack_s: "=agc_attack_symbols / symbol_rate"
            decay_s: "=agc_decay_symbols / symbol_rate"
        - id: "gr::blocks::sync::FllBandEdge"
          parameters:
            name: fll
            samples_per_symbol: "=sample_rate / (decimation * symbol_rate)"
            rolloff: "=rolloff"
            filter_length: "=fll_filter_length"
            noise_bandwidth: "=fll_noise_bandwidth"
        - id: "gr::blocks::sync::SymbolSync<complex<float32>>"
          parameters:
            name: timing
            samples_per_symbol: "=sample_rate / (decimation * symbol_rate)"
            rolloff: "=rolloff"
            noise_bandwidth: "=timing_noise_bandwidth"
            detector: "=timing_detector"
            constellation: "bpsk"
      connections:
        - [translate, 0, channel, 0]
        - [channel, 0, agc, 0]
        - [agc, 0, fll, 0]
        - [fll, 0, timing, 0]
      exported_ports:
        - [translate, INPUT, in, in]
        - [timing, OUTPUT, out, out]
