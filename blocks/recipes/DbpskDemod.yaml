# gr::recipes::DbpskDemod, differential BPSK demodulation.
#
# The recipe runs BpskFrontEnd's five stages, a one-symbol phasor and the real part. BpskDemod tracks the carrier
# phase and decides on the axis it finds. This recipe does not estimate the phase. For a noiseless input
# x[n] = A*exp(j*theta)*d[n] with d in {+1,-1},
#
#   Re( x[n] * conj(x[n-1]) ) = A^2 * d[n] * d[n-1]
#
# and theta cancels exactly. The decision is on the product of adjacent symbols. The data must therefore be
# differentially encoded at the transmitter. gr::blocks::digital::DifferentialEncoder at modulus 2 is that encoder.
# The recipe returns the differences of the encoded bit stream, and those are the original bits.
#
# Adjacent-symbol errors are correlated. At the same Eb/N0 the differential error rate is about twice the coherent
# one. In exchange there is no phase ambiguity, no acquisition transient on a phase loop and no cycle slip.
#
# DifferentialPhasor has no settings. Its first output is exactly zero, as there is no previous symbol to multiply
# against. Item 0 of a run is therefore not a decision, and a framer's sync word must not begin at it.
#
# The two blocks that differ from BpskDemod make up the differential arm. It is a sibling recipe and not a parameter.
# It changes the block set, and the recipe dialect has no conditionals.
#
# The parameters are BpskFrontEnd's. There is no carrier loop, and so no loop bandwidth. The five front-end stages are
# written out in this file as the same blocks BpskFrontEnd holds.
#
# Timing recovery runs before carrier recovery. The timing detector must therefore need no decision.
#
# The gain control's time constants are in symbol periods, and the recipe divides them by `symbol_rate`. A gain loop
# that reads the instantaneous magnitude follows the modulation's own envelope. Its time constant must be long against
# a symbol to avoid that. The decay constant is twice the attack by default. The gain rises half as fast as it falls.
#
# The input is complex baseband at sample_rate. The output is one soft symbol per symbol, except item 0.
definition_metadata:
  block_type: gr::recipes::DbpskDemod
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: dbpsk_demod
    exported_parameters:
      - name: sample_rate
        type: float32
        doc: "input sample rate in hertz (required)"
      - name: symbol_rate
        type: float32
        doc: "symbol rate in hertz (required)"
      - name: frequency_offset
        type: float64
        default: !!float64 0.0
        doc: "carrier offset from the front end's center in hertz"
      - name: decimation
        type: uint32
        default: !!uint32 1
        doc: "channel filter decimation giving about four samples per symbol"
      - name: channel_bandwidth
        type: float64
        default: !!float64 0.75
        doc: "cutoff of the channel filter as a multiple of the symbol rate"
      - name: rolloff
        type: float64
        default: !!float64 0.35
        doc: "excess bandwidth of the transmit shaping filter, in [0, 1]"
      - name: fll_noise_bandwidth
        type: float64
        default: !!float64 0.01
        doc: "frequency-locked loop noise bandwidth in Bn*T per sample"
      - name: fll_filter_length
        type: uint32
        default: !!uint32 45
        doc: "taps in each band-edge filter"
      - name: timing_detector
        type: string
        default: "Gardner"
        doc: "timing error detector, one of Gardner, ZeroCrossing or EarlyLate"
      - name: timing_noise_bandwidth
        type: float64
        default: !!float64 0.002
        doc: "closed-loop noise bandwidth of the timing recovery, normalized to the symbol rate"
      - name: agc_reference_db
        type: float64
        default: !!float64 0.0
        doc: "target output level of the front end's AGC, in decibels"
      - name: agc_attack_symbols
        type: float64
        default: !!float64 256.0
        doc: "gain-control time constant while the gain falls, in symbol periods"
      - name: agc_decay_symbols
        type: float64
        default: !!float64 512.0
        doc: "gain-control time constant while the gain rises, in symbol periods"
    graph:
      blocks:
        - id: "gr::blocks::math::Rotator<complex<float32>>"
          parameters:
            name: translate
            sample_rate: "=sample_rate"
            frequency_shift: "=-frequency_offset"
        - id: "gr::blocks::filter::DesignedFilter<complex<float32>, float32>"
          parameters:
            name: channel
            profile: "lowpass"
            sample_rate: "=sample_rate"
            cutoff: "=channel_bandwidth * symbol_rate"
            transition_width: "=0.5 * channel_bandwidth * symbol_rate"
            decimation: "=decimation"
        - id: "gr::blocks::analog::Agc<complex<float32>>"
          parameters:
            name: agc
            sample_rate: "=sample_rate / decimation"
            reference_db: "=agc_reference_db"
            attack_s: "=agc_attack_symbols / symbol_rate"
            decay_s: "=agc_decay_symbols / symbol_rate"
        - id: "gr::blocks::sync::FllBandEdge"
          parameters:
            name: fll
            samples_per_symbol: "=sample_rate / (decimation * symbol_rate)"
            rolloff: "=rolloff"
            filter_length: "=fll_filter_length"
            noise_bandwidth: "=fll_noise_bandwidth"
        - id: "gr::blocks::sync::SymbolSync<complex<float32>>"
          parameters:
            name: timing
            samples_per_symbol: "=sample_rate / (decimation * symbol_rate)"
            rolloff: "=rolloff"
            noise_bandwidth: "=timing_noise_bandwidth"
            detector: "=timing_detector"
            constellation: "bpsk"
        - id: "gr::blocks::digital::DifferentialPhasor<float32>"
          parameters:
            name: phasor
        - id: "gr::blocks::basic::Real<complex<float32>>"
          parameters:
            name: decision
      connections:
        - [translate, 0, channel, 0]
        - [channel, 0, agc, 0]
        - [agc, 0, fll, 0]
        - [fll, 0, timing, 0]
        - [timing, 0, phasor, 0]
        - [phasor, 0, decision, 0]
      exported_ports:
        - [translate, INPUT, in, in]
        - [decision, OUTPUT, real, out]
