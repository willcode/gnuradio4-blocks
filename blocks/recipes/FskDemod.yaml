# gr::recipes::FskDemod, noncoherent reception of two-level FSK and its continuous-phase relatives.
#
# The recipe derives the discriminator gain. A continuous-phase modulator turns the carrier by pi*h*a radians per
# symbol of amplitude a. A discriminator scaled by samples_per_symbol / (pi*h) therefore returns the transmitted PAM
# grid directly. A full-response symbol averages to its own amplitude over the symbol. The slicer and the level
# tracker work on that grid. In FM terms the same gain is sample_rate / (2*pi*deviation). The deviation of a two-level
# signal is h * symbol_rate / 2.
#
# The chain is a channel filter, the discriminator, a post-detection lowpass, the burst timing preset, timing recovery
# and the slicer.
#
# At the default `preamble_symbols` of 0 the preset stage passes samples through. A continuous link uses that default.
# A burst link sets `preamble_symbols` to the count of alternating symbols its preamble carries. The stage then
# measures the burst's symbol phase from the tone those symbols leave. It sends the phase to the timing loop as a tag.
# A burst is too short for the loop to acquire on its own, and the tag removes that acquisition.
#
# The channel filter keeps the receiver above the FM click threshold. A discriminator's noise is the noise in its input
# band. At eight samples per symbol an unfiltered front end sees nine decibels more noise than the signal band carries.
# The bit error rate then follows a different exponent from the noncoherent bound. With the filter the rate stays a
# fixed distance from the bound. With the channel filter at 0.6 symbol rates the chain measures between 0.32 and 1.11
# times the noncoherent orthogonal reference exp(-EbN0/2)/2, over 6 to 12 dB Es/N0.
#
# The discriminator is the arctangent of the product of consecutive samples, the earlier one conjugated. Its output
# depends on the phase advance alone. The chain accepts the signal at any amplitude.
#
# `modulation_index` is signed, and its sign sets the polarity. The recipe follows the convention that a positive soft
# decision is a one. A link whose higher-frequency tone carries the zero states a negative h. The discriminator gain
# then inverts, and the slicer's grid comes out the right way up. No extra setting and no inverting block are needed.
# A receiver that passes the magnitude of h delivers every bit inverted. Only a CRC then detects the inversion. The
# deviation is the same quantity and is not a second parameter. The recipe dialect has no conditional to choose between
# two spellings of one number. A caller who knows the deviation states h = 2*deviation/symbol_rate.
#
# The timing error detector is a parameter. It defaults to Mueller and Muller. The bit error rates above were measured
# with that detector. The other six detectors carry their own gains. Selecting one needs only a new measurement of the
# rates.
#
# The input is complex baseband at sample_rate. The output is one label per symbol. sample_rate, symbol_rate and
# modulation_index have no defaults. Every link differs in exactly these three, and a general recipe requires them.
definition_metadata:
  block_type: gr::recipes::FskDemod
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: fsk_demod
    exported_parameters:
      - name: sample_rate
        type: float32
        doc: "input sample rate in hertz (required)"
      - name: symbol_rate
        type: float32
        doc: "symbol rate in hertz (required)"
      - name: modulation_index
        type: float64
        doc: "signed modulation index h (required), negative when the higher tone is zero"
      - name: channel_bandwidth
        type: float64
        default: !!float64 0.6
        doc: "pre-discriminator filter cutoff in multiples of the symbol rate"
      - name: lowpass_bandwidth
        type: float64
        default: !!float64 0.5
        doc: "post-discriminator lowpass cutoff in multiples of the symbol rate"
      - name: noise_bandwidth
        type: float64
        default: !!float64 0.002
        doc: "closed-loop noise bandwidth of the timing recovery, normalized to the symbol rate"
      - name: detector
        type: string
        default: "MuellerMuller"
        doc: "timing error detector: MuellerMuller, ModifiedMuellerMuller, ZeroCrossing, Gardner, EarlyLate, SignalTimesSlopeMl or SignumTimesSlopeMl"
      - name: preamble_symbols
        type: uint32
        default: !!uint32 0
        doc: "alternating training symbols a burst opens with, 0 to disable the preset"
    graph:
      blocks:
        - id: "gr::blocks::filter::DesignedFilter<complex<float32>, float32>"
          parameters:
            name: channel
            profile: "lowpass"
            sample_rate: "=sample_rate"
            cutoff: "=channel_bandwidth * symbol_rate"
            transition_width: "=0.5 * channel_bandwidth * symbol_rate"
        - id: "gr::blocks::analog::QuadratureDemod<float32>"
          parameters:
            name: discriminator
            gain: "=sample_rate / (symbol_rate * pi * modulation_index)"
        - id: "gr::blocks::filter::DesignedFilter<float32, float32>"
          parameters:
            name: lowpass
            profile: "lowpass"
            sample_rate: "=sample_rate"
            cutoff: "=lowpass_bandwidth * symbol_rate"
            transition_width: "=0.5 * lowpass_bandwidth * symbol_rate"
        - id: "gr::blocks::sync::PreambleTiming<float32>"
          parameters:
            name: preamble
            sample_rate: "=sample_rate"
            symbol_rate: "=symbol_rate"
            preamble_symbols: "=preamble_symbols"
        - id: "gr::blocks::sync::SymbolSync<float32>"
          parameters:
            name: timing
            samples_per_symbol: "=sample_rate / symbol_rate"
            noise_bandwidth: "=noise_bandwidth"
            detector: "=detector"
        - id: "gr::blocks::digital::PamSlicer<float32>"
          parameters:
            name: slicer
            n_levels: !!uint32 2
      connections:
        - [channel, 0, discriminator, 0]
        - [discriminator, 0, lowpass, 0]
        - [lowpass, 0, preamble, 0]
        - [preamble, 0, timing, 0]
        - [timing, 0, slicer, 0]
      exported_ports:
        - [channel, INPUT, in, in]
        - [slicer, OUTPUT, out, out]
