# gr::recipes::KissStreamDecode, a KISS byte stream from any source, reassembled and decoded.
#
# The chain is RecordTrim, DataSetToStream<u8>, DelimiterExtractor<u8>(slip) and KissDecode. It reassembles a KISS byte
# stream that a transport split across message boundaries. It carries the escape state across those boundaries.
# `DataSetToStream` flattens the record fragments that arrive into one stream. `DelimiterExtractor` runs over the
# flattened stream and sees no record boundary. A frame that the transport split mid-byte or mid-escape therefore
# reassembles correctly. Two settings keep a fragment boundary from resetting that state, and both are needed. An
# empty `boundary_label` stops `DataSetToStream` from labeling each fragment with a trigger of its own.
# `trigger_resets: false` stops the extractor from resynchronizing on a trigger that a fragment already carried in its
# metadata. `DataSetToStream` re-emits such a trigger in preference to the label. A KISS stream marks its frame
# boundaries with the SLIP delimiter alone. The extractor takes its boundaries from the bytes alone. `RecordTrim`'s
# `drop_head` strips a link header ahead of the KISS stream. Its default of 0 leaves the stream whole unless the caller
# sets one. `read_timestamp` keeps KissDecode's own default.
#
# The SLIP profile is spelled out as in the other three KISS recipes. The profile has these settings.
#
#   end delimiter    0xC0 ("11000000", MSB first)
#   escaping         byte escaping
#   introducer       0xDB (219)
#   map              {0xDC (220) -> 0xC0 (192), 0xDD (221) -> 0xDB (219)}
#   bits per item    8
#
# `max_payload_items` is `DelimiterExtractor`'s own required bound. The recipe forwards it with no default, as
# `KissFileRead` does.
definition_metadata:
  block_type: gr::recipes::KissStreamDecode
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: kiss_stream_decode
    exported_parameters:
      - name: drop_head
        type: uint32
        default: !!uint32 0
        doc: "items removed from the start of each input record"
      - name: max_payload_items
        type: uint32
        doc: "DelimiterExtractor's bound on a decoded frame's items (required)"
      - name: read_timestamp
        type: bool
        default: !!bool false
        doc: "read a command-9 control frame as the next data frame's timestamp"
    graph:
      blocks:
        - id: "gr::blocks::basic::RecordTrim"
          parameters:
            name: trim
            drop_head: "=drop_head"
        - id: "gr::blocks::basic::DataSetToStream<uint8>"
          parameters:
            name: flatten
            boundary_label: "" # empty suppresses the trigger tag at a fragment boundary
        - id: "gr::blocks::digital::DelimiterExtractor<uint8>"
          parameters:
            name: extractor
            end_delimiter: "11000000"
            transparency: "byte_escape"
            escape_item: !!uint32 219
            escape_map: !!uint32 [220, 192, 221, 219]
            bits_per_item: !!uint32 8
            max_payload_items: "=max_payload_items"
            trigger_resets: !!bool false # the SLIP delimiter marks a frame boundary, and a fragment's own trigger does not
        - id: "gr::blocks::ax25::KissDecode"
          parameters:
            name: kiss
            read_timestamp: "=read_timestamp"
      connections:
        - [trim, 0, flatten, 0]
        - [flatten, 0, extractor, 0]
        - [extractor, 0, kiss, 0]
      exported_ports:
        - [trim, INPUT, in, in]
        - [kiss, OUTPUT, out, out]
