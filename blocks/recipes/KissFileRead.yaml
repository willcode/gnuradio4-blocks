# gr::recipes::KissFileRead, a KISS file read back to records.
#
# The chain is BasicFileSource<u8>, DelimiterExtractor<u8>(slip) and KissDecode. It is the counterpart of
# `KissFileWrite`. A byte stream has no record boundary of its own. `DelimiterExtractor` rebuilds each record from the
# SLIP framing a KISS writer added. `KissDecode` then strips the command byte. With `read_timestamp` it reads a
# command-9 frame into the next data record's `DataSet::timestamp`. `read_timestamp` keeps KissDecode's own default.
#
# The SLIP profile is the one `KissFileWrite` spells out, and the two recipes are read against each other. The profile
# has these settings.
#
#   end delimiter    0xC0 ("11000000", MSB first)
#   escaping         byte escaping
#   introducer       0xDB (219)
#   map              {0xDC (220) -> 0xC0 (192), 0xDD (221) -> 0xDB (219)}
#   bits per item    8
#
# `max_payload_items` is `DelimiterExtractor`'s own required bound and has no default here. The recipe does not assume
# a peer's frame length. `file_name` is required, as it is in `KissFileWrite`.
definition_metadata:
  block_type: gr::recipes::KissFileRead
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: kiss_file_read
    exported_parameters:
      - name: file_name
        type: string
        doc: "path of the KISS file (required)"
      - name: max_payload_items
        type: uint32
        doc: "DelimiterExtractor's bound on a decoded frame's items (required)"
      - name: read_timestamp
        type: bool
        default: !!bool false
        doc: "read a command-9 control frame as the next data frame's timestamp"
    graph:
      blocks:
        - id: "gr::blocks::fileio::BasicFileSource<uint8>"
          parameters:
            name: file
            file_name: "=file_name"
        - id: "gr::blocks::digital::DelimiterExtractor<uint8>"
          parameters:
            name: extractor
            end_delimiter: "11000000"
            transparency: "byte_escape"
            escape_item: !!uint32 219
            escape_map: !!uint32 [220, 192, 221, 219]
            bits_per_item: !!uint32 8
            max_payload_items: "=max_payload_items"
        - id: "gr::blocks::ax25::KissDecode"
          parameters:
            name: kiss
            read_timestamp: "=read_timestamp"
      connections:
        - [file, 0, extractor, 0]
        - [extractor, 0, kiss, 0]
      exported_ports:
        - [kiss, OUTPUT, out, out]
