# gr::recipes::FskDemodDcBlock, FskDemod's chain with a DC blocker after the discriminator.
#
# A discriminator turns a frequency offset into a DC offset. A receiver mistuned by df gives the slicer a PAM grid
# shifted by df / deviation of a level. Past half a level every symbol is decided wrong. FskDemod does not remove this
# offset. This recipe puts gr::blocks::filter::DcBlocker between the discriminator and the post-detection lowpass. The
# blocker removes the mean and leaves the modulation.
#
# The DC blocker is a sibling recipe and not a setting. DcBlocker has no bypass. Adding it to FskDemod would change that
# recipe's measured bit error rates. A sibling leaves FskDemod's measured rates unchanged.
#
# The recipe derives FskDemod's values.
#
#   discriminator gain = sample_rate / (symbol_rate * pi * modulation_index) = sample_rate / (2*pi*deviation)
#   samples per symbol = sample_rate / symbol_rate
#
# The blocker's notch corner is about sample_rate / dc_block_length. The corner must sit well below the symbol rate. A
# higher corner removes part of the modulation as well as the offset. A `dc_block_length` of 128 at eight samples per
# symbol puts the corner at symbol_rate / 16. The recipe depends on that inequality. A long-form blocker's group delay
# is 2*length - 2 samples. The recipe does not compensate it, and the timing loop absorbs it.
#
# A sub-audio link uses this recipe with its own parameters and needs no third file. A sub-audio FSK link carries its
# data under a voice channel. Its deviation is small and its symbol rate is low. The discriminator's output carries an
# offset that the blocker removes. Set `channel_bandwidth` and `lowpass_bandwidth` from the deviation and not from the
# audio band. Set `dc_block_length` to keep sample_rate / dc_block_length well under symbol_rate.
#
# `modulation_index` is signed, as in FskDemod. A negative h means the higher-frequency tone carries the zero. The gain
# inverts with h, and a positive soft decision stays a one.
#
# The output is the soft symbol stream and not the sliced labels FskDemod returns. Soft symbols are the general form. A
# PamSlicer after this recipe slices them. Sliced labels cannot be turned back into soft symbols.
#
# The input is complex baseband at sample_rate. The output is one soft symbol per symbol.
definition_metadata:
  block_type: gr::recipes::FskDemodDcBlock
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: fsk_demod_dc_block
    exported_parameters:
      - name: sample_rate
        type: float32
        doc: "input sample rate in hertz (required)"
      - name: symbol_rate
        type: float32
        doc: "symbol rate in hertz (required)"
      - name: modulation_index
        type: float64
        doc: "signed modulation index h (required), negative when the higher tone is zero"
      - name: channel_bandwidth
        type: float64
        default: !!float64 0.6
        doc: "pre-discriminator filter cutoff in multiples of the symbol rate"
      - name: lowpass_bandwidth
        type: float64
        default: !!float64 0.5
        doc: "post-discriminator lowpass cutoff in multiples of the symbol rate"
      - name: dc_block_length
        type: uint32
        default: !!uint32 128
        doc: "boxcar length D of the DC blocker, corner about sample_rate/D"
      - name: noise_bandwidth
        type: float64
        default: !!float64 0.002
        doc: "closed-loop noise bandwidth of the timing recovery, normalized to the symbol rate"
      - name: detector
        type: string
        default: "MuellerMuller"
        doc: "timing error detector: MuellerMuller, ModifiedMuellerMuller, ZeroCrossing, Gardner, EarlyLate, SignalTimesSlopeMl or SignumTimesSlopeMl"
    graph:
      blocks:
        - id: "gr::blocks::filter::DesignedFilter<complex<float32>, float32>"
          parameters:
            name: channel
            profile: "lowpass"
            sample_rate: "=sample_rate"
            cutoff: "=channel_bandwidth * symbol_rate"
            transition_width: "=0.5 * channel_bandwidth * symbol_rate"
        - id: "gr::blocks::analog::QuadratureDemod<float32>"
          parameters:
            name: discriminator
            gain: "=sample_rate / (symbol_rate * pi * modulation_index)"
        - id: "gr::blocks::filter::DcBlocker<float32>"
          parameters:
            name: dc_block
            length: "=dc_block_length"
        - id: "gr::blocks::filter::DesignedFilter<float32, float32>"
          parameters:
            name: lowpass
            profile: "lowpass"
            sample_rate: "=sample_rate"
            cutoff: "=lowpass_bandwidth * symbol_rate"
            transition_width: "=0.5 * lowpass_bandwidth * symbol_rate"
        - id: "gr::blocks::sync::SymbolSync<float32>"
          parameters:
            name: timing
            samples_per_symbol: "=sample_rate / symbol_rate"
            noise_bandwidth: "=noise_bandwidth"
            detector: "=detector"
      connections:
        - [channel, 0, discriminator, 0]
        - [discriminator, 0, dc_block, 0]
        - [dc_block, 0, lowpass, 0]
        - [lowpass, 0, timing, 0]
      exported_ports:
        - [channel, INPUT, in, in]
        - [timing, OUTPUT, out, out]
