# gr::recipes::AfskDemod, audio frequency-shift keying from a real audio stream to soft symbols.
#
# AFSK is the modulation of the largest population of amateur satellites. A sound card delivers it as audio. It uses
# two audio tones, one per bit, on a real stream. The recipe first builds an analytic signal from a Hilbert branch and
# a matching delay. From there it is an ordinary FSK receiver. The default `hilbert_taps` of 127 keeps the band from
# 0.0125 to 0.4875 of the sample rate within 2 percent of unity.
#
# The recipe derives these values.
#
#   band center        = (mark_hz + space_hz) / 2, translated to zero by the rotator
#   signed deviation   = (mark_hz - space_hz) / 2
#   discriminator gain = (sample_rate / decimation) / (2*pi*deviation)
#                      = sample_rate / (decimation * pi * (mark_hz - space_hz))
#   real branch delay  = (hilbert_taps - 1) / 2, the Hilbert design's own group delay
#   samples per symbol = sample_rate / (decimation * symbol_rate)
#
# The position of `space_hz` relative to `mark_hz` sets the output polarity. The recipe follows the convention that a
# positive soft decision is a one. The deviation (mark_hz - space_hz)/2 is negative when the tone carrying a one is
# the lower of the two. Bell 202 is such a case. The discriminator gain is then negative as well. The soft symbol
# carries the right sign with no separate setting and no inverting block. A receiver that takes the magnitude of the
# deviation delivers every bit inverted. Only a CRC then detects the inversion.
#
# Bell 202, the AX.25 tone pair, is worked through here as an example. Its values are not the defaults. Mark (a one)
# is 1200 Hz and space (a zero) is 2200 Hz, at 1200 Bd. The band center is 1700 Hz and the signed deviation is
# -500 Hz. The modulation index is h = 2*500/1200 = 0.8333. Carson's rule gives 2*(500 + 600) = 2200 Hz occupied.
# The complex-baseband cutoff is then 1100 Hz, or 0.9167 symbol rates. That is the default of `channel_bandwidth`. In
# general the cutoff is |h|/2 + 0.5 symbol rates, half of Carson's bandwidth. At 48 kHz with decimation 5 the
# discriminator gain is 48000 / (5*pi*(1200 - 2200)) = -3.055775. The timing loop then runs at eight samples per
# symbol. `mark_hz` and `space_hz` are required, and there is no default tone pair. A link's tone pair is an
# interoperability fact. A default pair would let a wrong one pass unnoticed.
#
# Bell 202's tones are not orthogonal. At h = 0.8333 their correlation is |sin(pi*h)/(pi*h)| = 0.190986. The
# noncoherent bit error rate is then 0.5*exp(-(Eb/N0)*(1-0.190986)/2). The orthogonal rate is 0.5*exp(-(Eb/N0)/2).
# The difference is a 0.92 dB penalty. As a ratio of error rates it grows with Eb/N0, from 1.27x at 4 dB to 4.54x at
# 12 dB. A test that compares against the orthogonal rate fails this chain because of the modulation and not the
# receiver.
#
# A subgraph exports an input port to exactly one interior port. An output port fans out freely. `split` is the node
# whose single output feeds both branches. It is a SampleDelay of zero, which copies its input.
#
# The input is real audio at sample_rate. The output is one soft symbol per symbol, positive for a mark.
definition_metadata:
  block_type: gr::recipes::AfskDemod
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: afsk_demod
    exported_parameters:
      - name: sample_rate
        type: float32
        doc: "input audio sample rate in hertz (required)"
      - name: symbol_rate
        type: float32
        doc: "symbol rate in hertz (required)"
      - name: mark_hz
        type: float64
        doc: "tone carrying a one, in hertz (required)"
      - name: space_hz
        type: float64
        doc: "tone carrying a zero, in hertz (required)"
      - name: decimation
        type: uint32
        default: !!uint32 1
        doc: "channel filter decimation giving about eight samples per symbol"
      - name: hilbert_taps
        type: uint32
        default: !!uint32 127
        doc: "length of the Hilbert transformer, odd"
      - name: channel_bandwidth
        type: float64
        default: !!float64 0.9167
        doc: "pre-discriminator filter cutoff as a multiple of the symbol rate"
      - name: lowpass_bandwidth
        type: float64
        default: !!float64 0.5
        doc: "post-discriminator lowpass cutoff in multiples of the symbol rate"
      - name: noise_bandwidth
        type: float64
        default: !!float64 0.002
        doc: "closed-loop noise bandwidth of the timing recovery, normalized to the symbol rate"
      - name: detector
        type: string
        default: "Gardner"
        doc: "timing error detector: MuellerMuller, ModifiedMuellerMuller, ZeroCrossing, Gardner, EarlyLate, SignalTimesSlopeMl or SignumTimesSlopeMl"
    graph:
      blocks:
        - id: "gr::blocks::basic::SampleDelay<float32>"
          parameters:
            name: split
            delay: !!uint32 0
        - id: "gr::blocks::filter::DesignedFilter<float32, float32>"
          parameters:
            name: hilbert
            profile: "hilbert"
            sample_rate: "=sample_rate"
            taps: "=hilbert_taps"
        - id: "gr::blocks::basic::SampleDelay<float32>"
          parameters:
            name: delay
            delay: "=(hilbert_taps - 1) / 2"
        - id: "gr::blocks::basic::RealImagToComplex<float32>"
          parameters:
            name: analytic
        - id: "gr::blocks::math::Rotator<complex<float32>>"
          parameters:
            name: translate
            sample_rate: "=sample_rate"
            frequency_shift: "=-(mark_hz + space_hz) / 2"
        - id: "gr::blocks::filter::DesignedFilter<complex<float32>, float32>"
          parameters:
            name: channel
            profile: "lowpass"
            sample_rate: "=sample_rate"
            cutoff: "=channel_bandwidth * symbol_rate"
            transition_width: "=0.5 * channel_bandwidth * symbol_rate"
            decimation: "=decimation"
        - id: "gr::blocks::analog::QuadratureDemod<float32>"
          parameters:
            name: discriminator
            gain: "=sample_rate / (decimation * pi * (mark_hz - space_hz))"
        - id: "gr::blocks::filter::DesignedFilter<float32, float32>"
          parameters:
            name: lowpass
            profile: "lowpass"
            sample_rate: "=sample_rate / decimation"
            cutoff: "=lowpass_bandwidth * symbol_rate"
            transition_width: "=0.5 * lowpass_bandwidth * symbol_rate"
        - id: "gr::blocks::sync::SymbolSync<float32>"
          parameters:
            name: timing
            samples_per_symbol: "=sample_rate / (decimation * symbol_rate)"
            noise_bandwidth: "=noise_bandwidth"
            detector: "=detector"
      connections:
        - [split, 0, hilbert, 0]
        - [split, 0, delay, 0]
        - [delay, 0, analytic, 0]
        - [hilbert, 0, analytic, 1]
        - [analytic, 0, translate, 0]
        - [translate, 0, channel, 0]
        - [channel, 0, discriminator, 0]
        - [discriminator, 0, lowpass, 0]
        - [lowpass, 0, timing, 0]
      exported_ports:
        - [split, INPUT, in, in]
        - [timing, OUTPUT, out, out]
