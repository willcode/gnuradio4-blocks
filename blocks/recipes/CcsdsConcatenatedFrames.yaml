# gr::recipes::CcsdsConcatenatedFrames, the CCSDS concatenated receive chain from soft channel symbols to transfer
# frames.
#
# The concatenated chain is the Reed-Solomon chain with the inner convolutional code in front of it. The chain finds
# the marker in the channel-symbol domain, before any decoding. That decision shapes the rest of the recipe. The
# Viterbi decoder here decodes one bounded record and not a running stream. The record boundary must therefore be
# known before the trellis runs. The chain finds each record by its encoded attached sync marker.
#
# An encoded marker is not a constant. Its first symbols depend on the data before it, because the inner encoder's
# register still holds that data. From marker bit K-1 onward the register holds only the marker's own bits. The last
# 2*(32-6) = 52 encoded symbols are therefore the same whatever came before. They are a true constant of the channel,
# and the correlator searches for that word. `encoded_marker` carries the word and is required. The word is a function
# of the convention. gr::blocks::digital::syncword::ccsdsEncodedAsm(convolutional) derives it. A caller calls that
# function with the same name it passes as `convolutional`. A definition cannot call a function. The derived word
# therefore enters as a parameter.
#
# The correlator tags at the word's first symbol (tag_at code_start). That symbol is 12 symbols into the encoded
# marker. From there the record carries these symbols.
#
#     52                                  the marker's state-independent symbols, the trellis's run-up
#   + (frame_length + 2*E*I) * 8 * 2      the codeblock's bits at the rate-1/2 expansion
#   + 12                                  2*(K-1) symbols beyond the codeblock
#
# An open decode's last K-1 information bits lack the later symbols that would resolve them. The 12-symbol margin
# puts those unreliable bits outside the codeblock, and the trim drops them. After the open decode the record is bits.
# It holds 26 marker bits of run-up at the head and 6 margin bits at the tail. The codeblock lies between
# them. RecordTrim removes the 26 and the 6. The derandomizer removes 10.4.3's sequence from the codeblock. The rest is
# the Reed-Solomon chain unchanged.
#
# A rate-1/2 stream has a pairing ambiguity in which symbol opens a (G1, G2) pair. This chain needs no arm for it. The
# correlator searches every stream offset, and the record is cut where the marker sits. The pairing follows from the
# marker's own position. A one-symbol shift of the input moves the tag by one symbol and changes nothing after it. A
# chain whose framer anchored to stream parity would need two instances. This chain aligns itself, and the test
# checks that it decodes at either input offset.
#
# `basis` has no default, and a wrong choice decodes nothing. `convolutional` names one of four conventions in use and
# has no default.
#
# The differential-precoding arm and the randomizer-off exception change the block set. They belong in sibling
# recipes, as in CcsdsRsFrames.
#
# The input is soft channel symbols at one value per symbol. The output is one DataSet<uint8> record of bytes per
# transfer frame.
definition_metadata:
  block_type: gr::recipes::CcsdsConcatenatedFrames
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: ccsds_concatenated_frames
    exported_parameters:
      - name: frame_length
        type: uint32
        doc: "transfer frame octets kI - Q, a multiple of interleave (required)"
      - name: error_capability
        type: uint32
        doc: "symbol-correction capability E per codeword, 16 or 8, agreeing with code"
      - name: code
        type: string
        doc: "Reed-Solomon profile ccsds_255_223 (E = 16) or ccsds_255_239 (E = 8)"
      - name: basis
        type: string
        doc: "symbol basis, conventional or dual (required)"
      - name: convolutional
        type: string
        doc: "inner code convention, ccsds, ccsds_uninverted, nasa_dsn or nasa_dsn_uninverted"
      - name: encoded_marker
        type: string
        doc: "the marker's 52 state-independent encoded symbols (required)"
      - name: sync_errors
        type: uint32
        doc: "correlator max_errors in raw channel symbols of the 52-symbol word (required)"
      - name: interleave
        type: uint32
        default: !!uint32 1
        doc: "codewords I per codeblock, 1, 2, 3, 4, 5 or 8"
    graph:
      blocks:
        - id: "gr::blocks::digital::AccessCodeCorrelator<float32>"
          parameters:
            name: marker
            access_code: "=encoded_marker"
            max_errors: "=sync_errors"
            trigger_label: "ccsds_asm_symbols"
            tag_at: "code_start"
        - id: "gr::blocks::digital::PacketFramer<float32>"
          parameters:
            name: symbol_record
            header_format: "fixed_length"
            fixed_payload_items: "=52 + (frame_length + 2 * error_capability * interleave) * 16 + 12"
            max_payload_items: "=52 + (frame_length + 2 * error_capability * interleave) * 16 + 12"
            trigger: "ccsds_asm_symbols"
        - id: "gr::blocks::fec::ViterbiDecodeSoft"
          parameters:
            name: inner
            code: "=convolutional"
            termination: "open"
        - id: "gr::blocks::basic::RecordTrim"
          parameters:
            name: trim
            drop_head: !!uint32 26
            drop_tail: !!uint32 6
        - id: "gr::blocks::digital::AdditiveScrambler<gr::DataSet<uint8>>"
          parameters:
            name: derandomizer
            taps: "1,3,5,8"
            seed: "11111111"
            bits_per_item: !!uint32 1
        - id: "gr::blocks::digital::RecordRepackBits"
          parameters:
            name: packer
            bits_in: !!uint32 1
            bits_out: !!uint32 8
            output_bit_order: "MsbFirst"
        - id: "gr::blocks::fec::RsDecode"
          parameters:
            name: rs
            code: "=code"
            basis: "=basis"
            roots: "=2 * error_capability"
            interleave: "=interleave"
            pad: "=(255 - 2 * error_capability) - frame_length / interleave"
      connections:
        - [marker, 0, symbol_record, 0]
        - [symbol_record, 0, inner, 0]
        - [inner, 0, trim, 0]
        - [trim, 0, derandomizer, 0]
        - [derandomizer, 0, packer, 0]
        - [packer, 0, rs, 0]
      exported_ports:
        - [marker, INPUT, in, in]
        - [rs, OUTPUT, out, out]
