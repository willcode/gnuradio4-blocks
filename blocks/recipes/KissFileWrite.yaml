# gr::recipes::KissFileWrite, a record chain written to a KISS file.
#
# The chain is KissEncode, DelimiterFramer(slip), DataSetToStream<u8> and BasicFileSink<u8>. A KISS terminal node
# controller writes its frames to a file this way. `KissEncode` prepends the command byte. With `emit_timestamp` it
# also writes a command-9 stamp frame ahead of a record whose `DataSet::timestamp` is non-zero. `DelimiterFramer` adds
# the SLIP framing. `DataSetToStream<u8>` flattens the framed record onto a byte stream, as a file has no record
# boundary of its own. `BasicFileSink<u8>` appends that stream to a file. The chain carries data frames only, as
# `KissEncode` does alone. It sends no KISS parameter frame.
#
# The recipe spells out the SLIP profile and does not name it. A reader sees the framing without opening a header. The
# profile is `gr::digital::slip()` read back as the `DelimiterFramer` settings it compiles to.
#
#   end delimiter    0xC0 ("11000000", MSB first)
#   escaping         byte escaping
#   introducer       0xDB (219)
#   map              {0xDC (220) -> 0xC0 (192), 0xDD (221) -> 0xDB (219)}
#   bits per item    8
#
# `file_name` and `mode` belong to `BasicFileSink`. `kiss_port` and `emit_timestamp` belong to `KissEncode`. Each keeps
# its block's own default where it has one. The defaults are `mode` "overwrite", `kiss_port` 0 and `emit_timestamp`
# false. `file_name` is required. A sink with no path has nothing to write to.
definition_metadata:
  block_type: gr::recipes::KissFileWrite
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: kiss_file_write
    exported_parameters:
      - name: file_name
        type: string
        doc: "path of the KISS file (required)"
      - name: mode
        type: string
        default: "overwrite"
        doc: "file write mode, 'overwrite', 'append' or 'multi'"
      - name: kiss_port
        type: uint32
        default: !!uint32 0
        doc: "terminal node controller port of a frame, 0 to 15"
      - name: emit_timestamp
        type: bool
        default: !!bool false
        doc: "publish a command-9 frame before each data frame with a non-zero timestamp"
    graph:
      blocks:
        - id: "gr::blocks::ax25::KissEncode"
          parameters:
            name: kiss
            kiss_port: "=kiss_port"
            emit_timestamp: "=emit_timestamp"
        - id: "gr::blocks::digital::DelimiterFramer"
          parameters:
            name: framer
            end_delimiter: "11000000"
            transparency: "byte_escape"
            escape_item: !!uint32 219
            escape_map: !!uint32 [220, 192, 221, 219]
            bits_per_item: !!uint32 8
            max_payload_items: !!uint32 4096
        - id: "gr::blocks::basic::DataSetToStream<uint8>"
          parameters:
            name: flatten
        - id: "gr::blocks::fileio::BasicFileSink<uint8>"
          parameters:
            name: file
            file_name: "=file_name"
            mode: "=mode"
      connections:
        - [kiss, 0, framer, 0]
        - [framer, 0, flatten, 0]
        - [flatten, 0, file, 0]
      exported_ports:
        - [kiss, INPUT, in, in]
