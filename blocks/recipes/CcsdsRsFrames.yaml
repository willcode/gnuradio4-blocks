# gr::recipes::CcsdsRsFrames, the CCSDS Reed-Solomon receive chain from soft bits to transfer frames.
#
# The recipe is the standard's chain for a Reed-Solomon-coded telemetry link. It follows 131.0-B-5 section 4, with the
# attached sync marker of section 9. The chain finds the ASM in the bit stream and cuts the codeblock behind it. It
# removes the randomizer, packs the bits into symbols and decodes. One record is one codeblock end to end. The
# derandomizer's epoch is therefore the record itself. That follows 10.4.3, where the generator initializes at the
# start of each codeblock. The derandomizer needs no reset tag.
#
# The input is one soft value per channel bit, positive for a one. Reed-Solomon is a hard-decision code. The chain
# slices the soft values before any block reads them. The correlator's comparison slices at zero in any case. Slicing
# first keeps the whole chain on the byte carrier. The chain has no soft consumer after the slice, and the slice loses
# nothing.
#
# The recipe derives the bindings below. Write n = 255, E = error_capability and I = interleave. frame_length is the
# transfer frame's octets, the standard's kI - Q.
#
#   - The codeblock on the wire is (frame_length + 2*E*I) octets, per 4.3.8.1 c. The correlator's bit stream carries
#     it as 8 times that many items. That is the framer's fixed length.
#   - The shortening per codeword is pad = (255 - 2E) - frame_length/I, the standard's Q/I. A frame_length that is
#     not a multiple of I gives a wrong pad. The decoder then counts refusals. This is the rule of 4.3.7.3, "Q is a
#     multiple of I", written as arithmetic.
#   - The decoder's parity count is 2E. The decoder's own agreement check refuses a code and error_capability pair
#     that disagree. The two parameters state one fact, and the block checks it.
#
# `code` and `error_capability` are both exported. A definition cannot derive one from the other. The dialect's
# expressions are arithmetic, and the profile is a name. `basis` is required, as it is on the block. 4.3.9.1 mandates
# the dual basis. Part of the flown population uses the conventional basis. A wrong choice decodes nothing, and
# neither end can guess the right one. `sync_errors` is required. The marker's error budget is an operating point and
# not a property of the chain.
#
# The differential-precoding arm and the randomizer-off exception each change the block set. An arm that changes the
# block set is a sibling recipe and not a parameter. This definition follows the standard's norm, and 4.2.1 makes the
# randomizer the norm. A link that needs precoding resolves it ahead of this recipe.
#
# The input is soft bits at one value per channel bit. The output is one DataSet<uint8> record of bytes per transfer
# frame.
definition_metadata:
  block_type: gr::recipes::CcsdsRsFrames
  plugin_name: GrRecipes
  plugin_author: gnuradio4 recipes
  plugin_license: MIT
  plugin_version: "2026-09-02"
blocks:
  - id: SUBGRAPH
    parameters:
      name: ccsds_rs_frames
    exported_parameters:
      - name: frame_length
        type: uint32
        doc: "transfer frame octets kI - Q, a multiple of interleave (required)"
      - name: error_capability
        type: uint32
        doc: "symbol-correction capability E per codeword, 16 or 8, agreeing with code (required)"
      - name: code
        type: string
        doc: "Reed-Solomon profile ccsds_255_223 (E = 16) or ccsds_255_239 (E = 8) (required)"
      - name: basis
        type: string
        doc: "symbol basis, conventional or dual (required)"
      - name: sync_errors
        type: uint32
        doc: "marker correlator max_errors in bits of the 32-bit ASM (required)"
      - name: interleave
        type: uint32
        default: !!uint32 1
        doc: "codewords I per codeblock, 1, 2, 3, 4, 5 or 8"
    graph:
      blocks:
        - id: "gr::blocks::digital::PamSlicer<float32>"
          parameters:
            name: slicer
            n_levels: !!uint32 2
        - id: "gr::blocks::digital::AccessCodeCorrelator<uint8>"
          parameters:
            name: asm_correlator
            access_code: "00011010110011111111110000011101"
            max_errors: "=sync_errors"
            trigger_label: "ccsds_asm"
        - id: "gr::blocks::digital::PacketFramer<uint8>"
          parameters:
            name: codeblock
            header_format: "fixed_length"
            fixed_payload_items: "=(frame_length + 2 * error_capability * interleave) * 8"
            max_payload_items: "=(frame_length + 2 * error_capability * interleave) * 8"
            trigger: "ccsds_asm"
        - id: "gr::blocks::digital::AdditiveScrambler<gr::DataSet<uint8>>"
          parameters:
            name: derandomizer
            taps: "1,3,5,8"
            seed: "11111111"
            bits_per_item: !!uint32 1
        - id: "gr::blocks::digital::RecordRepackBits"
          parameters:
            name: packer
            bits_in: !!uint32 1
            bits_out: !!uint32 8
            output_bit_order: "MsbFirst"
        - id: "gr::blocks::fec::RsDecode"
          parameters:
            name: rs
            code: "=code"
            basis: "=basis"
            roots: "=2 * error_capability"
            interleave: "=interleave"
            pad: "=(255 - 2 * error_capability) - frame_length / interleave"
      connections:
        - [slicer, 0, asm_correlator, 0]
        - [asm_correlator, 0, codeblock, 0]
        - [codeblock, 0, derandomizer, 0]
        - [derandomizer, 0, packer, 0]
        - [packer, 0, rs, 0]
      exported_ports:
        - [slicer, INPUT, in, in]
        - [rs, OUTPUT, out, out]
