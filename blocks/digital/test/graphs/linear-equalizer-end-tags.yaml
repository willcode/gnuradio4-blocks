# LinearEqualizer at 2 samples per symbol makes 1 output per 2 inputs and forwards a tag on input t on output
# t / 2. With one tap, frozen, it passes the input through, so every output is 1 + 0j. Nine inputs end in a
# partial chunk of one sample, which makes no output, and its tag stays on the input until the end-of-stream
# call places it at the end-of-stream index.
#   source, 9 samples        tags 2, 8
#   equalizer, 4 symbols     tags 1, 4
blocks:
  - id: gr::blocks::testing::VectorSource<complex<float32>>
    parameters:
      name: source
      values: !!complex32
        - (1.0, 0.0)
        - (1.0, 0.0)
        - (1.0, 0.0)
        - (1.0, 0.0)
        - (1.0, 0.0)
        - (1.0, 0.0)
        - (1.0, 0.0)
        - (1.0, 0.0)
        - (1.0, 0.0)
      tag_indices: !!uint32 [2, 8]
      tag_map:
        trigger_name: mark
  - id: gr::blocks::digital::LinearEqualizer<float32>
    parameters:
      name: equalizer
      num_taps: !!uint32 1
      samples_per_symbol: !!uint32 2
      freeze: true
  - id: gr::blocks::testing::ExpectSink<complex<float32>>
    parameters:
      name: sink
      tolerance: 1.0e-6
      expected: !!complex32
        - (1.0, 0.0)
        - (1.0, 0.0)
        - (1.0, 0.0)
        - (1.0, 0.0)
      tag_key: trigger_name
      tag_indices: !!uint32 [1, 4]
connections:
  - [source, out, equalizer, in]
  - [equalizer, out, sink, in]
