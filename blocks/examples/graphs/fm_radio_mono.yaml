# Broadcast FM, mono, from a wideband front end to audio with this repository's own blocks.
#
# The file writes out the chain of gr::recipes::WbfmMonoDemod. It states the numbers the recipe
# derives.
#
#   channel rate       = 1920000 / 8            = 240 kHz
#   discriminator gain = 240000 / (2*pi*75000)  = 0.5092958
#   audio ratio        = 48000 / 240000         = 0.2
#
# Change the front-end rate and all three numbers move together. The recipe derives all three from
# the rate.
#
# Substitute these blocks for a real receiver.
#
#   rf_source  -> gr::blocks::sdr::SoapySource<complex<float32>> (-DGR4_ENABLE_SDR=ON), tuned to
#                 the station. The generator stands in, and the graph loads and runs with no
#                 hardware. It is paced to wall-clock time and delivers 1.92 MS/s as a radio does.
#                 Its tone is 15 kHz above center. That is a carrier at a fifth of full deviation,
#                 and it demodulates to a steady 0.2.
#   audio_sink -> gr::blocks::audio::AudioSink<float32> (-DGR4_ENABLE_AUDIO=ON) to hear it, or one
#                 of studio's own gr::studio::* sinks, which are not in this repository. A headless
#                 host reads the audio through DataSink, and the test does the same.
#
# Edges name their ports. A studio series or waterfall sink's `in` is a port collection. A bare `in`
# on one connects nothing and passes no data, with no error. Write those edges as `in#0`. DataSink's
# `in` is a plain port and is written as one.
blocks:
  - id: gr::blocks::basic::SignalGenerator<complex<float32>>
    parameters:
      name: rf_source
      sample_rate: !!float32 1920000.0
      signal_type: Sin
      tone_frequency: !!float32 15000.0
      amplitude: !!float32 1.0
      chunk_size: !!uint32 8192
  - id: gr::blocks::math::Rotator<complex<float32>>
    parameters:
      name: tuner
      sample_rate: !!float32 1920000.0
      frequency_shift: !!float32 0.0
  - id: gr::blocks::filter::StagedDecimator<complex<float32>>
    parameters:
      name: channel
      decimation: !!uint32 8
      passband_width: !!float32 0.8
  - id: gr::blocks::analog::QuadratureDemod<float32>
    parameters:
      name: discriminator
      gain: !!float32 0.5092958
  - id: gr::blocks::filter::ArbitraryRateResampler<float32>
    parameters:
      name: audio
      rate: !!float64 0.2
  - id: gr::blocks::analog::FmDeemphasis<float32>
    parameters:
      name: deemphasis
      sample_rate: !!float32 48000.0
      tau: !!float64 7.5e-05
  - id: gr::blocks::basic::DataSink<float32>
    parameters:
      name: audio_sink
      signal_name: fm_audio
      sample_rate: !!float32 48000.0
connections:
  - [rf_source, out, tuner, in]
  - [tuner, out, channel, in]
  - [channel, out, discriminator, in]
  - [discriminator, out, audio, in]
  - [audio, out, deemphasis, in]
  - [deemphasis, out, audio_sink, in]
