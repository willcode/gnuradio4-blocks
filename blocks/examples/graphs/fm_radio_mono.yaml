# Broadcast FM, mono: a wideband front end down to audio, from this repository's own blocks.
#
# This is gr::recipes::WbfmMonoDemod's chain written out. The recipe cannot be named here: the
# YAML graph loader instantiates a block from its `id` alone and never hands the block's
# `parameters` to PluginLoader::instantiate, so a recipe with a required exported parameter
# refuses and the file fails to load. Written out, the numbers the recipe derives have to be
# stated instead, and they are what it would have derived:
#
#   channel rate       = 1920000 / 8            = 240 kHz
#   discriminator gain = 240000 / (2*pi*75000)  = 0.5092958
#   audio ratio        = 48000 / 240000         = 0.2
#
# Change the front-end rate and all three move together. That is the argument for the recipe;
# this file is what a graph editor can carry until the loader passes parameters through.
#
# What to substitute for a real receiver:
#
#   rf_source  -> gr::blocks::sdr::SoapySource<complex<float32>> (-DGR4_ENABLE_SDR=ON), tuned to
#                 the station. The generator stands in so the graph loads and runs with no
#                 hardware; it is paced to wall-clock time, so it delivers 1.92 MS/s the way a
#                 radio does. Its tone sits 15 kHz above center, which is a carrier at a fifth of
#                 full deviation and demodulates to a steady 0.2.
#   audio_sink -> gr::blocks::audio::AudioSink<float32> (-DGR4_ENABLE_AUDIO=ON) to hear it, or one
#                 of studio's own gr::studio::* sinks, which are not in this repository. DataSink
#                 is what a headless host reads the audio through, and it is what the gate uses.
#
# Edges name their ports. A studio series or waterfall sink's `in` is a port COLLECTION, and a
# bare `in` on one connects nothing and silently passes no data - write those edges `in#0`.
# DataSink's `in` is a plain port and is written as one.
blocks:
  - id: gr::blocks::basic::SignalGenerator<complex<float32>>
    parameters:
      name: rf_source
      sample_rate: !!float32 1920000.0
      signal_type: Sin
      tone_frequency: !!float32 15000.0
      amplitude: !!float32 1.0
      chunk_size: !!uint32 8192
  - id: gr::blocks::math::Rotator<complex<float32>>
    parameters:
      name: tuner
      sample_rate: !!float32 1920000.0
      frequency_shift: !!float32 0.0
  - id: gr::blocks::filter::StagedDecimator<complex<float32>>
    parameters:
      name: channel
      decimation: !!uint32 8
      passband_width: !!float32 0.8
  - id: gr::blocks::analog::QuadratureDemod<float32>
    parameters:
      name: discriminator
      gain: !!float32 0.5092958
  - id: gr::blocks::filter::ArbitraryResampler<float32>
    parameters:
      name: audio
      rate: !!float64 0.2
  - id: gr::blocks::analog::FmDeemphasis<float32>
    parameters:
      name: deemphasis
      sample_rate: !!float32 48000.0
      tau: !!float64 7.5e-05
  - id: gr::blocks::basic::DataSink<float32>
    parameters:
      name: audio_sink
      signal_name: fm_audio
      sample_rate: !!float32 48000.0
connections:
  - [rf_source, out, tuner, in]
  - [tuner, out, channel, in]
  - [channel, out, discriminator, in]
  - [discriminator, out, audio, in]
  - [audio, out, deemphasis, in]
  - [deemphasis, out, audio_sink, in]
