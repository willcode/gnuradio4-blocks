# The math keys for the one-input conversions of a complex or real stream, connected by their port names in and out.
#   Abs:               (3,4) (0,-2)  -> 5 2
#     scale 2, offset 10:            -> 5 * 2 + 10 = 20, 2 * 2 + 10 = 14
#   Abs, uint8:        0 127 128 200 255 -> 0 127 128 200 255, each sample its own absolute value
#   Real, Imag, Angle: (3,4) (0,-2)  -> 3 0, 4 -2, atan2(4,3) -pi/2
#   radians to degrees, MultiplyConst by 180/pi: pi/2 -pi -> 90 -180
#   degrees to radians, MultiplyConst by pi/180: 90 -180  -> pi/2 -pi
blocks:
  - id: gr::blocks::testing::VectorSource<complex<float32>>
    parameters:
      name: complex_source
      values: !!complex32
        - (3.0, 4.0)
        - (0.0, -2.0)
  - id: gr::blocks::math::Abs<complex<float32>>
    parameters:
      name: abs
  - id: gr::blocks::math::Abs<complex<float32>>
    parameters:
      name: abs_affine
      scale: !!float32 2.0
      offset: !!float32 10.0
  - id: gr::blocks::math::Real<complex<float32>>
    parameters:
      name: real
  - id: gr::blocks::math::Imag<complex<float32>>
    parameters:
      name: imag
  - id: gr::blocks::math::Angle<complex<float32>>
    parameters:
      name: angle
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: abs_sink
      expected: !!float32 [5.0, 2.0]
      tolerance: 1e-6
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: abs_affine_sink
      expected: !!float32 [20.0, 14.0]
      tolerance: 1e-5
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: real_sink
      expected: !!float32 [3.0, 0.0]
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: imag_sink
      expected: !!float32 [4.0, -2.0]
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: angle_sink
      expected: !!float32 [0.9272952180016122, -1.5707963267948966]
      tolerance: 1e-6
  - id: gr::blocks::testing::VectorSource<float32>
    parameters:
      name: radians_source
      values: !!float32 [1.5707963267948966, -3.141592653589793]
  - id: gr::blocks::math::MultiplyConst<float32>
    parameters:
      name: to_degrees
      value: !!float32 57.29577951308232
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: degrees_sink
      expected: !!float32 [90.0, -180.0]
      tolerance: 1e-4
  - id: gr::blocks::testing::VectorSource<uint8>
    parameters:
      name: uint8_source
      values: [0, 127, 128, 200, 255]
  - id: gr::blocks::math::Abs<uint8>
    parameters:
      name: abs_u8
  - id: gr::blocks::testing::ExpectSink<uint8>
    parameters:
      name: abs_u8_sink
      expected: [0, 127, 128, 200, 255]
  - id: gr::blocks::testing::VectorSource<float32>
    parameters:
      name: degrees_source
      values: !!float32 [90.0, -180.0]
  - id: gr::blocks::math::MultiplyConst<float32>
    parameters:
      name: to_radians
      value: !!float32 0.017453292519943295
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: radians_sink
      expected: !!float32 [1.5707963267948966, -3.141592653589793]
      tolerance: 1e-6
connections:
  - [complex_source, out, abs, in]
  - [complex_source, out, abs_affine, in]
  - [complex_source, out, real, in]
  - [complex_source, out, imag, in]
  - [complex_source, out, angle, in]
  - [abs, out, abs_sink, in]
  - [abs_affine, out, abs_affine_sink, in]
  - [real, out, real_sink, in]
  - [imag, out, imag_sink, in]
  - [angle, out, angle_sink, in]
  - [radians_source, out, to_degrees, in]
  - [to_degrees, out, degrees_sink, in]
  - [degrees_source, out, to_radians, in]
  - [to_radians, out, radians_sink, in]
  - [uint8_source, out, abs_u8, in]
  - [abs_u8, out, abs_u8_sink, in]
