# Three weights for one output of two inputs. The run ends with an error that names both shapes.
blocks:
  - id: gr::blocks::testing::VectorSource<complex<float32>>
    parameters:
      name: input_0
      values: !!complex32
        - (1.0, 0.0)
  - id: gr::blocks::testing::VectorSource<complex<float32>>
    parameters:
      name: input_1
      values: !!complex32
        - (2.0, 0.0)
  - id: gr::blocks::array::LinearCombine<complex<float32>>
    parameters:
      name: combine
      weights: !!complex32
        - (1.0, 0.0)
        - (1.0, 0.0)
        - (1.0, 0.0)
  - id: gr::blocks::testing::ExpectSink<complex<float32>>
    parameters:
      name: combined
connections:
  - [input_0, out, combine, "in#0"]
  - [input_1, out, combine, "in#1"]
  - [combine, "out#0", combined, in]
