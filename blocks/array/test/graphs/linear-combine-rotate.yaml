# Weights of (1, j) add the second input turned by a quarter cycle: j*(a+jb) = (-b, a).
#   (1,2) + j(4,-4) = (1,2) + (4,4) = (5,6)
#   (-3,0.5) + j(0.25,0) = (-3,0.5) + (0,0.25) = (-3,0.75)
#   (0,-1) + j(-2,7) = (0,-1) + (-7,-2) = (-7,-3)
blocks:
  - id: gr::blocks::testing::VectorSource<complex<float32>>
    parameters:
      name: input_0
      values: !!complex32
        - (1.0, 2.0)
        - (-3.0, 0.5)
        - (0.0, -1.0)
  - id: gr::blocks::testing::VectorSource<complex<float32>>
    parameters:
      name: input_1
      values: !!complex32
        - (4.0, -4.0)
        - (0.25, 0.0)
        - (-2.0, 7.0)
  - id: gr::blocks::array::LinearCombine<complex<float32>>
    parameters:
      name: combine
      weights: !!complex32
        - (1.0, 0.0)
        - (0.0, 1.0)
  - id: gr::blocks::testing::ExpectSink<complex<float32>>
    parameters:
      name: rotated_sum
      expected: !!complex32
        - (5.0, 6.0)
        - (-3.0, 0.75)
        - (-7.0, -3.0)
connections:
  - [input_0, out, combine, "in#0"]
  - [input_1, out, combine, "in#1"]
  - [combine, "out#0", rotated_sum, in]
