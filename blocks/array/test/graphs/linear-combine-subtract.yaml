# Weights of (1, -1) subtract the second input from the first.
#   (1,2) - (4,-4) = (-3,6), (-3,0.5) - (0.25,0) = (-3.25,0.5), (0,-1) - (-2,7) = (2,-8)
blocks:
  - id: gr::blocks::testing::VectorSource<complex<float32>>
    parameters:
      name: input_0
      values: !!complex32
        - (1.0, 2.0)
        - (-3.0, 0.5)
        - (0.0, -1.0)
  - id: gr::blocks::testing::VectorSource<complex<float32>>
    parameters:
      name: input_1
      values: !!complex32
        - (4.0, -4.0)
        - (0.25, 0.0)
        - (-2.0, 7.0)
  - id: gr::blocks::array::LinearCombine<complex<float32>>
    parameters:
      name: combine
      weights: !!complex32
        - (1.0, 0.0)
        - (-1.0, 0.0)
  - id: gr::blocks::testing::ExpectSink<complex<float32>>
    parameters:
      name: difference
      expected: !!complex32
        - (-3.0, 6.0)
        - (-3.25, 0.5)
        - (2.0, -8.0)
connections:
  - [input_0, out, combine, "in#0"]
  - [input_1, out, combine, "in#1"]
  - [combine, "out#0", difference, in]
