# ShiftLeft: out = in << count, the bits past the top dropped; 0 for a count at or past the width.
#   the values in hex, as the bits of the type; the lists hold the same values in decimal.
#   uint8, count 3:
#     0x0F 0xF0 0xFF 0x00 0xA5
#     -> 0x78 0x80 0xF8 0x00 0x28
#   uint8, count 7:
#     0x0F 0xF0 0xFF 0x00 0xA5
#     -> 0x80 0x00 0x80 0x00 0x80
#   uint8, count 8, the width:
#     0x0F 0xF0 0xFF 0x00 0xA5
#     -> 0x00 0x00 0x00 0x00 0x00
#   int16, count 3:
#     0x0F0F 0xFFFF 0x7FFF 0x8000 0x1234
#     -> 0x7878 0xFFF8 0xFFF8 0x0000 0x91A0
#   int16, count 15:
#     0x0F0F 0xFFFF 0x7FFF 0x8000 0x1234
#     -> 0x8000 0x8000 0x8000 0x0000 0x0000
#   int16, count 16, the width:
#     0x0F0F 0xFFFF 0x7FFF 0x8000 0x1234
#     -> 0x0000 0x0000 0x0000 0x0000 0x0000
#   int32, count 3:
#     0x0F0F0F0F 0xFFFFFFFF 0x7FFFFFFF 0x80000000 0x12345678
#     -> 0x78787878 0xFFFFFFF8 0xFFFFFFF8 0x00000000 0x91A2B3C0
#   int32, count 31:
#     0x0F0F0F0F 0xFFFFFFFF 0x7FFFFFFF 0x80000000 0x12345678
#     -> 0x80000000 0x80000000 0x80000000 0x00000000 0x00000000
#   int32, count 32, the width:
#     0x0F0F0F0F 0xFFFFFFFF 0x7FFFFFFF 0x80000000 0x12345678
#     -> 0x00000000 0x00000000 0x00000000 0x00000000 0x00000000
