# Pow: out = a to the power b.
#   (2,3) -> 8 (the product is 6), (2,-1) -> 0.5, (-2,3) -> -8, (4,0.5) -> 2, (0,0) -> 1,
#   (-2,0.5) -> NaN (a negative base with a fractional exponent).
# Tolerance: 4 eps of the type relative to the expected value (2^-21 for float32, 2^-50 for float64).
blocks:
  - id: gr::blocks::testing::VectorSource<float32>
    parameters:
      name: source_a_f32
      values: !!float32 [2.0, 2.0, -2.0, 4.0, 0.0, -2.0]
  - id: gr::blocks::testing::VectorSource<float32>
    parameters:
      name: source_b_f32
      values: !!float32 [3.0, -1.0, 3.0, 0.5, 0.0, 0.5]
  - id: gr::blocks::math::Pow<float32>
    parameters:
      name: pow_f32
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32
      expected: !!float32 [8.0, 0.5, -8.0, 2.0, 1.0, .nan]
      relative_tolerance: 4.76837158203125e-07
  - id: gr::blocks::testing::VectorSource<float64>
    parameters:
      name: source_a_f64
      values: !!float64 [2.0, 2.0, -2.0, 4.0, 0.0, -2.0]
  - id: gr::blocks::testing::VectorSource<float64>
    parameters:
      name: source_b_f64
      values: !!float64 [3.0, -1.0, 3.0, 0.5, 0.0, 0.5]
  - id: gr::blocks::math::Pow<float64>
    parameters:
      name: pow_f64
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64
      expected: !!float64 [8.0, 0.5, -8.0, 2.0, 1.0, .nan]
      relative_tolerance: 8.881784197001252e-16
connections:
  - [source_a_f32, out, pow_f32, a]
  - [source_b_f32, out, pow_f32, b]
  - [pow_f32, out, sink_f32, in]
  - [source_a_f64, out, pow_f64, a]
  - [source_b_f64, out, pow_f64, b]
  - [pow_f64, out, sink_f64, in]
