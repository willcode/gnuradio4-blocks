# Max: out = the larger of a and b, sample by sample.
#   uint8:   a 0 200 7 255          b 5 100 7 0             -> 5 200 7 255 (200 stays above 127)
#   int16:   a -3 0 7 -32768        b 2 -5 7 32767          -> 2 0 7 32767
#   int32:   a -3 0 7 100000        b 2 -5 7 -100000        -> 2 0 7 100000
#   float32: a -1.5 0 2.25 -0.5     b 0.5 -3 2.25 -0.75     -> 0.5 0 2.25 -0.5
#   float64: a -1.5 0 2.25 1e300    b 0.5 -3 2.25 -1e300    -> 0.5 0 2.25 1e300
#   NaN:     a NaN 1.5 NaN          b 2 NaN NaN             -> NaN 1.5 NaN, the sample of a, in both real types
blocks:
  - id: gr::blocks::testing::VectorSource<uint8>
    parameters:
      name: source_a_u8
      values: [0, 200, 7, 255]
  - id: gr::blocks::testing::VectorSource<uint8>
    parameters:
      name: source_b_u8
      values: [5, 100, 7, 0]
  - id: gr::blocks::math::Max<uint8>
    parameters:
      name: max_u8
  - id: gr::blocks::testing::ExpectSink<uint8>
    parameters:
      name: sink_u8
      expected: [5, 200, 7, 255]
  - id: gr::blocks::testing::VectorSource<int16>
    parameters:
      name: source_a_i16
      values: [-3, 0, 7, -32768]
  - id: gr::blocks::testing::VectorSource<int16>
    parameters:
      name: source_b_i16
      values: [2, -5, 7, 32767]
  - id: gr::blocks::math::Max<int16>
    parameters:
      name: max_i16
  - id: gr::blocks::testing::ExpectSink<int16>
    parameters:
      name: sink_i16
      expected: [2, 0, 7, 32767]
  - id: gr::blocks::testing::VectorSource<int32>
    parameters:
      name: source_a_i32
      values: [-3, 0, 7, 100000]
  - id: gr::blocks::testing::VectorSource<int32>
    parameters:
      name: source_b_i32
      values: [2, -5, 7, -100000]
  - id: gr::blocks::math::Max<int32>
    parameters:
      name: max_i32
  - id: gr::blocks::testing::ExpectSink<int32>
    parameters:
      name: sink_i32
      expected: [2, 0, 7, 100000]
  - id: gr::blocks::testing::VectorSource<float32>
    parameters:
      name: source_a_f32
      values: !!float32 [-1.5, 0.0, 2.25, -0.5]
  - id: gr::blocks::testing::VectorSource<float32>
    parameters:
      name: source_b_f32
      values: !!float32 [0.5, -3.0, 2.25, -0.75]
  - id: gr::blocks::math::Max<float32>
    parameters:
      name: max_f32
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32
      expected: !!float32 [0.5, 0.0, 2.25, -0.5]
  - id: gr::blocks::testing::VectorSource<float64>
    parameters:
      name: source_a_f64
      values: !!float64 [-1.5, 0.0, 2.25, 1e+300]
  - id: gr::blocks::testing::VectorSource<float64>
    parameters:
      name: source_b_f64
      values: !!float64 [0.5, -3.0, 2.25, -1e+300]
  - id: gr::blocks::math::Max<float64>
    parameters:
      name: max_f64
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64
      expected: !!float64 [0.5, 0.0, 2.25, 1e+300]
  - id: gr::blocks::testing::VectorSource<float32>
    parameters:
      name: source_a_f32n
      values: !!float32 [.nan, 1.5, .nan]
  - id: gr::blocks::testing::VectorSource<float32>
    parameters:
      name: source_b_f32n
      values: !!float32 [2.0, .nan, .nan]
  - id: gr::blocks::math::Max<float32>
    parameters:
      name: max_f32n
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32n
      expected: !!float32 [.nan, 1.5, .nan]
  - id: gr::blocks::testing::VectorSource<float64>
    parameters:
      name: source_a_f64n
      values: !!float64 [.nan, 1.5, .nan]
  - id: gr::blocks::testing::VectorSource<float64>
    parameters:
      name: source_b_f64n
      values: !!float64 [2.0, .nan, .nan]
  - id: gr::blocks::math::Max<float64>
    parameters:
      name: max_f64n
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64n
      expected: !!float64 [.nan, 1.5, .nan]
connections:
  - [source_a_u8, out, max_u8, a]
  - [source_b_u8, out, max_u8, b]
  - [max_u8, out, sink_u8, in]
  - [source_a_i16, out, max_i16, a]
  - [source_b_i16, out, max_i16, b]
  - [max_i16, out, sink_i16, in]
  - [source_a_i32, out, max_i32, a]
  - [source_b_i32, out, max_i32, b]
  - [max_i32, out, sink_i32, in]
  - [source_a_f32, out, max_f32, a]
  - [source_b_f32, out, max_f32, b]
  - [max_f32, out, sink_f32, in]
  - [source_a_f64, out, max_f64, a]
  - [source_b_f64, out, max_f64, b]
  - [max_f64, out, sink_f64, in]
  - [source_a_f32n, out, max_f32n, a]
  - [source_b_f32n, out, max_f32n, b]
  - [max_f32n, out, sink_f32n, in]
  - [source_a_f64n, out, max_f64n, a]
  - [source_b_f64n, out, max_f64n, b]
  - [max_f64n, out, sink_f64n, in]
