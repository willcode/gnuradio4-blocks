# CumulativeSum: y[i] = y[i-1] + x[i] from zero; a tag that carries reset_key zeroes the sum before its sample,
# so the output at the tag's index equals the input there. An integer sum wraps in the sample type.
#   int16, reset at 3:      30000 5000 -1 | 7 2 -3        -> 30000, 35000 - 65536 = -30536, -30537 | 7, 9, 6
#   int32, reset_key restart, restart at 2:
#                           2e9 2e9 | 5 -10 4             -> 2e9, 4e9 - 2^32 = -294967296 | 5, -5, -1
#   float32, reset at 2, 4: 0.5 1.25 | -2 4 | 0.25 3      -> 0.5, 1.75 | -2, 2 | 0.25, 3.25
#   float64, reset at 3:    1.5 -0.75 1e300 | 2 -3.5      -> 1.5, 0.75, 1e300 (0.75 is below its last bit) | 2, -1.5
#   complex, reset at 2:    (1,-2) (0.5,0.5) | (-3,1) (2,2) -> (1,-2), (1.5,-1.5) | (-3,1), (-1,3)
blocks:
  - id: gr::blocks::testing::VectorSource<int16>
    parameters:
      name: source_i16
      values: [30000, 5000, -1, 7, 2, -3]
      tag_indices: !!uint32 [3]
      tag_map:
        reset: true
  - id: gr::blocks::math::CumulativeSum<int16>
    parameters:
      name: cumulative_sum_i16
  - id: gr::blocks::testing::ExpectSink<int16>
    parameters:
      name: sink_i16
      expected: [30000, -30536, -30537, 7, 9, 6]
  - id: gr::blocks::testing::VectorSource<int32>
    parameters:
      name: source_i32
      values: [2000000000, 2000000000, 5, -10, 4]
      tag_indices: !!uint32 [2]
      tag_map:
        restart: true
  - id: gr::blocks::math::CumulativeSum<int32>
    parameters:
      name: cumulative_sum_i32
      reset_key: restart
  - id: gr::blocks::testing::ExpectSink<int32>
    parameters:
      name: sink_i32
      expected: [2000000000, -294967296, 5, -5, -1]
  - id: gr::blocks::testing::VectorSource<float32>
    parameters:
      name: source_f32
      values: !!float32 [0.5, 1.25, -2.0, 4.0, 0.25, 3.0]
      tag_indices: !!uint32 [2, 4]
      tag_map:
        reset: true
  - id: gr::blocks::math::CumulativeSum<float32>
    parameters:
      name: cumulative_sum_f32
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32
      expected: !!float32 [0.5, 1.75, -2.0, 2.0, 0.25, 3.25]
  - id: gr::blocks::testing::VectorSource<float64>
    parameters:
      name: source_f64
      values: !!float64 [1.5, -0.75, 1e+300, 2.0, -3.5]
      tag_indices: !!uint32 [3]
      tag_map:
        reset: true
  - id: gr::blocks::math::CumulativeSum<float64>
    parameters:
      name: cumulative_sum_f64
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64
      expected: !!float64 [1.5, 0.75, 1e+300, 2.0, -1.5]
  - id: gr::blocks::testing::VectorSource<complex<float32>>
    parameters:
      name: source_c32
      values: !!complex32
        - (1.0, -2.0)
        - (0.5, 0.5)
        - (-3.0, 1.0)
        - (2.0, 2.0)
      tag_indices: !!uint32 [2]
      tag_map:
        reset: true
  - id: gr::blocks::math::CumulativeSum<complex<float32>>
    parameters:
      name: cumulative_sum_c32
  - id: gr::blocks::testing::ExpectSink<complex<float32>>
    parameters:
      name: sink_c32
      expected: !!complex32
        - (1.0, -2.0)
        - (1.5, -1.5)
        - (-3.0, 1.0)
        - (-1.0, 3.0)
connections:
  - [source_i16, out, cumulative_sum_i16, in]
  - [cumulative_sum_i16, out, sink_i16, in]
  - [source_i32, out, cumulative_sum_i32, in]
  - [cumulative_sum_i32, out, sink_i32, in]
  - [source_f32, out, cumulative_sum_f32, in]
  - [cumulative_sum_f32, out, sink_f32, in]
  - [source_f64, out, cumulative_sum_f64, in]
  - [cumulative_sum_f64, out, sink_f64, in]
  - [source_c32, out, cumulative_sum_c32, in]
  - [cumulative_sum_c32, out, sink_c32, in]
