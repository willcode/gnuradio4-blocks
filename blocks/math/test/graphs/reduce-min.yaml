# ReduceMin: one output per group of n, the smallest sample of the group. The samples past the last whole
# group stay unconsumed at the end of the stream.
#   uint8, n 2:   0 200 | 7 255 | 3 3 | 9                -> 0, 7, 3; 9 unconsumed
#   int16, n 4:   -3 0 7 -32768 | -5 -9 -1 -2 | 4 4      -> -32768, -9; 4 4 unconsumed
#   int32, n 1:   -3 0 100000 -100000                    -> the input
#   float32, n 4: -1.5 0 2.25 -0.5 | -3 -0.75 -2 -1 | 8 9 -> -1.5, -3; 8 9 unconsumed
#   float64, n 2: -1.5 0 | 2.25 1e300 | -3 -1e300 | 5    -> -1.5, 2.25, -1e300; 5 unconsumed
#   float32 long, n 40: a permutation of -20..19 | 19 down to -20 | 100 200 300 unconsumed;
#                      groups of 40 fill whole simd vectors
#                      -> -20, -20
blocks:
  - id: gr::blocks::testing::VectorSource<uint8>
    parameters:
      name: source_u8
      values: [0, 200, 7, 255, 3, 3, 9]
  - id: gr::blocks::math::ReduceMin<uint8>
    parameters:
      name: min_u8
      n: 2
  - id: gr::blocks::testing::ExpectSink<uint8>
    parameters:
      name: sink_u8
      expected: [0, 7, 3]
  - id: gr::blocks::testing::VectorSource<int16>
    parameters:
      name: source_i16
      values: [-3, 0, 7, -32768, -5, -9, -1, -2, 4, 4]
  - id: gr::blocks::math::ReduceMin<int16>
    parameters:
      name: min_i16
      n: 4
  - id: gr::blocks::testing::ExpectSink<int16>
    parameters:
      name: sink_i16
      expected: [-32768, -9]
  - id: gr::blocks::testing::VectorSource<int32>
    parameters:
      name: source_i32
      values: [-3, 0, 100000, -100000]
  - id: gr::blocks::math::ReduceMin<int32>
    parameters:
      name: min_i32
      n: 1
  - id: gr::blocks::testing::ExpectSink<int32>
    parameters:
      name: sink_i32
      expected: [-3, 0, 100000, -100000]
  - id: gr::blocks::testing::VectorSource<float32>
    parameters:
      name: source_f32
      values: !!float32
        - -1.5
        - 0.0
        - 2.25
        - -0.5
        - -3.0
        - -0.75
        - -2.0
        - -1.0
        - 8.0
        - 9.0
  - id: gr::blocks::math::ReduceMin<float32>
    parameters:
      name: min_f32
      n: 4
  - id: gr::blocks::testing::ExpectSink<float32>
    parameters:
      name: sink_f32
      expected: !!float32 [-1.5, -3.0]
  - id: gr::blocks::testing::VectorSource<float64>
    parameters:
      name: source_f64
      values: !!float64 [-1.5, 0.0, 2.25, 1e+300, -3.0, -1e+300, 5.0]
  - id: gr::blocks::math::ReduceMin<float64>
    parameters:
      name: min_f64
      n: 2
  - id: gr::blocks::testing::ExpectSink<float64>
    parameters:
      name: sink_f64
      expected: !!float64 [-1.5, 2.25, -1e+300]
  - id: gr::blocks::testing::VectorSource<float32>
