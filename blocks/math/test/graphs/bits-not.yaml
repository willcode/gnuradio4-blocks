# Not: out = ~in, and ~in * scale where scale is set.
#   the values in hex, as the bits of the type; the lists hold the same values in decimal.
#   uint8, no scale:
#     0x0F 0xF0 0xFF 0x00 0xA5
#     -> 0xF0 0x0F 0x00 0xFF 0x5A
#   uint8, scale 2 (the complement doubled in int, then narrowed: the bits past the top dropped):
#     0x0F 0xF0 0xFF 0x00 0xA5
#     -> 0xE0 0x1E 0x00 0xFE 0xB4
#   int16, no scale:
#     0x0F0F 0xFFFF 0x7FFF 0x8000 0x1234
#     -> 0xF0F0 0x0000 0x8000 0x7FFF 0xEDCB
#   int16, scale 2 (the complement doubled in int, then narrowed: the bits past the top dropped):
#     0x0F0F 0xFFFF 0x7FFF 0x8000 0x1234
#     -> 0xE1E0 0x0000 0x0000 0xFFFE 0xDB96
#   int32, no scale:
#     0x0F0F0F0F 0xFFFFFFFF 0x7FFFFFFF 0x80000000 0x12345678
#     -> 0xF0F0F0F0 0x00000000 0x80000000 0x7FFFFFFF 0xEDCBA987
#   int32, scale 2 (each doubled complement within int32):
#     0x0F0F0F0F 0xFFFFFFFF 0x12345678 0xC0000000 0x3FFFFFFF
#     -> 0xE1E1E1E0 0x00000000 0xDB97530E 0x7FFFFFFE 0x80000000
blocks:
  - id: gr::blocks::testing::VectorSource<uint8>
    parameters:
      name: source0_u8
      values: [15, 240, 255, 0, 165]
  - id: gr::blocks::math::Not<uint8>
    parameters:
      name: not0_u8
  - id: gr::blocks::testing::ExpectSink<uint8>
    parameters:
      name: sink0_u8
      expected: [240, 15, 0, 255, 90]
  - id: gr::blocks::testing::VectorSource<uint8>
    parameters:
      name: source1_u8
      values: [15, 240, 255, 0, 165]
  - id: gr::blocks::math::Not<uint8>
    parameters:
      name: not1_u8
      scale: 2
  - id: gr::blocks::testing::ExpectSink<uint8>
    parameters:
      name: sink1_u8
      expected: [224, 30, 0, 254, 180]
  - id: gr::blocks::testing::VectorSource<int16>
    parameters:
      name: source2_i16
      values: [3855, -1, 32767, -32768, 4660]
  - id: gr::blocks::math::Not<int16>
    parameters:
      name: not2_i16
  - id: gr::blocks::testing::ExpectSink<int16>
    parameters:
      name: sink2_i16
      expected: [-3856, 0, -32768, 32767, -4661]
  - id: gr::blocks::testing::VectorSource<int16>
    parameters:
      name: source3_i16
      values: [3855, -1, 32767, -32768, 4660]
  - id: gr::blocks::math::Not<int16>
    parameters:
      name: not3_i16
      scale: 2
  - id: gr::blocks::testing::ExpectSink<int16>
    parameters:
      name: sink3_i16
      expected: [-7712, 0, 0, -2, -9322]
  - id: gr::blocks::testing::VectorSource<int32>
    parameters:
      name: source4_i32
      values: [252645135, -1, 2147483647, -2147483648, 305419896]
  - id: gr::blocks::math::Not<int32>
    parameters:
      name: not4_i32
  - id: gr::blocks::testing::ExpectSink<int32>
    parameters:
      name: sink4_i32
      expected: [-252645136, 0, -2147483648, 2147483647, -305419897]
  - id: gr::blocks::testing::VectorSource<int32>
    parameters:
      name: source5_i32
      values: [252645135, -1, 305419896, -1073741824, 1073741823]
  - id: gr::blocks::math::Not<int32>
    parameters:
      name: not5_i32
      scale: 2
  - id: gr::blocks::testing::ExpectSink<int32>
    parameters:
      name: sink5_i32
      expected: [-505290272, 0, -610839794, 2147483646, -2147483648]
connections:
  - [source0_u8, out, not0_u8, in]
  - [not0_u8, out, sink0_u8, in]
  - [source1_u8, out, not1_u8, in]
  - [not1_u8, out, sink1_u8, in]
  - [source2_i16, out, not2_i16, in]
  - [not2_i16, out, sink2_i16, in]
  - [source3_i16, out, not3_i16, in]
  - [not3_i16, out, sink3_i16, in]
  - [source4_i32, out, not4_i32, in]
  - [not4_i32, out, sink4_i32, in]
  - [source5_i32, out, not5_i32, in]
  - [not5_i32, out, sink5_i32, in]
