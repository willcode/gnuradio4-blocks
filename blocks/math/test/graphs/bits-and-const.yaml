# AndConst: out = in & constant, with constant 0x0F and 0xF0 repeated over the width of the type.
#   the values in hex, as the bits of the type; the lists hold the same values in decimal.
#   uint8, constant 0x0F:
#     0x0F 0xF0 0xFF 0x00 0xA5 0x5A
#     -> 0x0F 0x00 0x0F 0x00 0x05 0x0A
#   uint8, constant 0xF0:
#     0x0F 0xF0 0xFF 0x00 0xA5 0x5A
#     -> 0x00 0xF0 0xF0 0x00 0xA0 0x50
#   int16, constant 0x0F0F:
#     0x0F0F 0xFFFF 0x7FFF 0x8000 0x1234 0xEDCB
#     -> 0x0F0F 0x0F0F 0x0F0F 0x0000 0x0204 0x0D0B
#   int16, constant 0xF0F0:
#     0x0F0F 0xFFFF 0x7FFF 0x8000 0x1234 0xEDCB
#     -> 0x0000 0xF0F0 0x70F0 0x8000 0x1030 0xE0C0
#   int32, constant 0x0F0F0F0F:
#     0x0F0F0F0F 0xFFFFFFFF 0x7FFFFFFF 0x80000000 0x12345678 0xEDCBA987
#     -> 0x0F0F0F0F 0x0F0F0F0F 0x0F0F0F0F 0x00000000 0x02040608 0x0D0B0907
#   int32, constant 0xF0F0F0F0:
#     0x0F0F0F0F 0xFFFFFFFF 0x7FFFFFFF 0x80000000 0x12345678 0xEDCBA987
#     -> 0x00000000 0xF0F0F0F0 0x70F0F0F0 0x80000000 0x10305070 0xE0C0A080
blocks:
