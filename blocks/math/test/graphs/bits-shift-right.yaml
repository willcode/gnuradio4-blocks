# ShiftRight: out = in >> count, arithmetic for int16 and int32, logical for uint8; 0 for a count at or past the width.
#   the values in hex, as the bits of the type; the lists hold the same values in decimal.
#   uint8, count 3, zeros shifted in:
#     0x0F 0xF0 0xFF 0x00 0xA5
#     -> 0x01 0x1E 0x1F 0x00 0x14
#   uint8, count 7:
#     0x0F 0xF0 0xFF 0x00 0xA5
#     -> 0x00 0x01 0x01 0x00 0x01
#   uint8, count 8, the width:
#     0x0F 0xF0 0xFF 0x00 0xA5
#     -> 0x00 0x00 0x00 0x00 0x00
#   int16, count 3, the sign bit copied in:
#     0x0F0F 0xFFFF 0x7FFF 0x8000 0x1234
#     -> 0x01E1 0xFFFF 0x0FFF 0xF000 0x0246
#   int16, count 15:
#     0x0F0F 0xFFFF 0x7FFF 0x8000 0x1234
#     -> 0x0000 0xFFFF 0x0000 0xFFFF 0x0000
#   int16, count 16, the width:
#     0x0F0F 0xFFFF 0x7FFF 0x8000 0x1234
#     -> 0x0000 0x0000 0x0000 0x0000 0x0000
#   int32, count 3, the sign bit copied in:
#     0x0F0F0F0F 0xFFFFFFFF 0x7FFFFFFF 0x80000000 0x12345678
#     -> 0x01E1E1E1 0xFFFFFFFF 0x0FFFFFFF 0xF0000000 0x02468ACF
#   int32, count 31:
#     0x0F0F0F0F 0xFFFFFFFF 0x7FFFFFFF 0x80000000 0x12345678
#     -> 0x00000000 0xFFFFFFFF 0x00000000 0xFFFFFFFF 0x00000000
#   int32, count 32, the width:
#     0x0F0F0F0F 0xFFFFFFFF 0x7FFFFFFF 0x80000000 0x12345678
#     -> 0x00000000 0x00000000 0x00000000 0x00000000 0x00000000
