# Argmin: one uint32 output per group of n, the index within the group of its smallest sample, the first of
# equal ones. The samples past the last whole group stay unconsumed at the end of the stream.
#   uint8, n 2:   0 200 | 7 7 | 255 3 | 9                     -> 0, 0 (equal), 1; 9 unconsumed
#   int16, n 4:   -3 7 7 -32768 | -5 -9 -1 -1 | 4 4           -> 3, 1; 4 4 unconsumed
#   int32, n 1:   -3 0 100000                                 -> 0 0 0, every group one sample
#   float32, n 4: -1.5 0 2.25 2.25 | -0.75 -3 -0.75 -2 | 8 9 -> 0, 1; 8 9 unconsumed
#   float64, n 2: -1.5 0 | 1e300 -1e300 | 5 5 | 6             -> 0, 1, 0 (equal); 6 unconsumed
blocks:
  - id: gr::blocks::testing::VectorSource<uint8>
    parameters:
      name: source_u8
      values: [0, 200, 7, 7, 255, 3, 9]
  - id: gr::blocks::math::Argmin<uint8>
    parameters:
      name: argmin_u8
      n: 2
  - id: gr::blocks::testing::ExpectSink<uint32>
    parameters:
      name: sink_u8
      expected: !!uint32 [0, 0, 1]
  - id: gr::blocks::testing::VectorSource<int16>
    parameters:
      name: source_i16
      values: [-3, 7, 7, -32768, -5, -9, -1, -1, 4, 4]
  - id: gr::blocks::math::Argmin<int16>
    parameters:
      name: argmin_i16
      n: 4
  - id: gr::blocks::testing::ExpectSink<uint32>
    parameters:
      name: sink_i16
      expected: !!uint32 [3, 1]
  - id: gr::blocks::testing::VectorSource<int32>
    parameters:
      name: source_i32
      values: [-3, 0, 100000]
  - id: gr::blocks::math::Argmin<int32>
    parameters:
      name: argmin_i32
      n: 1
  - id: gr::blocks::testing::ExpectSink<uint32>
    parameters:
      name: sink_i32
      expected: !!uint32 [0, 0, 0]
  - id: gr::blocks::testing::VectorSource<float32>
    parameters:
      name: source_f32
      values: !!float32
        - -1.5
        - 0.0
        - 2.25
        - 2.25
        - -0.75
        - -3.0
        - -0.75
        - -2.0
        - 8.0
        - 9.0
  - id: gr::blocks::math::Argmin<float32>
    parameters:
      name: argmin_f32
      n: 4
  - id: gr::blocks::testing::ExpectSink<uint32>
    parameters:
      name: sink_f32
      expected: !!uint32 [0, 1]
  - id: gr::blocks::testing::VectorSource<float64>
    parameters:
      name: source_f64
      values: !!float64 [-1.5, 0.0, 1e+300, -1e+300, 5.0, 5.0, 6.0]
  - id: gr::blocks::math::Argmin<float64>
    parameters:
      name: argmin_f64
      n: 2
  - id: gr::blocks::testing::ExpectSink<uint32>
    parameters:
      name: sink_f64
      expected: !!uint32 [0, 1, 0]
connections:
  - [source_u8, out, argmin_u8, in]
  - [argmin_u8, out, sink_u8, in]
  - [source_i16, out, argmin_i16, in]
  - [argmin_i16, out, sink_i16, in]
  - [source_i32, out, argmin_i32, in]
  - [argmin_i32, out, sink_i32, in]
  - [source_f32, out, argmin_f32, in]
  - [argmin_f32, out, sink_f32, in]
  - [source_f64, out, argmin_f64, in]
  - [argmin_f64, out, sink_f64, in]
