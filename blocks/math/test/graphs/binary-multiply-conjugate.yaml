# MultiplyConjugate: out = a * conj(b); each row is a, then conj(b), their product and the result.
#   (1,2)(3,-4)    = 3 - 4j + 6j + 8      -> (11,2); the plain product a * b is (-5,10)
#   (3,-1)(1,-1)   = 3 - 3j - j - 1       -> (2,-4)
#   (0,0)(5,6)                            -> (0,0)
#   (-2.5,4)(2,0.5) = -5 - 1.25j + 8j - 2 -> (-7,6.75)
#   (3,4)(3,-4)    = |a|^2                -> (25,0)
blocks:
  - id: gr::blocks::testing::VectorSource<complex<float32>>
    parameters:
      name: source_a_c32
      values: !!complex32
        - (1.0, 2.0)
        - (3.0, -1.0)
        - (0.0, 0.0)
        - (-2.5, 4.0)
        - (3.0, 4.0)
  - id: gr::blocks::testing::VectorSource<complex<float32>>
    parameters:
      name: source_b_c32
      values: !!complex32
        - (3.0, 4.0)
        - (1.0, 1.0)
        - (5.0, -6.0)
        - (2.0, -0.5)
        - (3.0, 4.0)
  - id: gr::blocks::math::MultiplyConjugate<complex<float32>>
    parameters:
      name: multiply_conjugate_c32
  - id: gr::blocks::testing::ExpectSink<complex<float32>>
    parameters:
      name: sink_c32
      expected: !!complex32
        - (11.0, 2.0)
        - (2.0, -4.0)
        - (0.0, 0.0)
        - (-7.0, 6.75)
        - (25.0, 0.0)
connections:
  - [source_a_c32, out, multiply_conjugate_c32, a]
  - [source_b_c32, out, multiply_conjugate_c32, b]
  - [multiply_conjugate_c32, out, sink_c32, in]
