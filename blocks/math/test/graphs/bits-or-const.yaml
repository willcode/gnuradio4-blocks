# OrConst: out = in | constant, with constant 0x0F and 0xF0 repeated over the width of the type.
#   the values in hex, as the bits of the type; the lists hold the same values in decimal.
#   uint8, constant 0x0F:
#     0x0F 0xF0 0xFF 0x00 0xA5 0x5A
#     -> 0x0F 0xFF 0xFF 0x0F 0xAF 0x5F
#   uint8, constant 0xF0:
#     0x0F 0xF0 0xFF 0x00 0xA5 0x5A
#     -> 0xFF 0xF0 0xFF 0xF0 0xF5 0xFA
#   int16, constant 0x0F0F:
#     0x0F0F 0xFFFF 0x7FFF 0x8000 0x1234 0xEDCB
#     -> 0x0F0F 0xFFFF 0x7FFF 0x8F0F 0x1F3F 0xEFCF
#   int16, constant 0xF0F0:
#     0x0F0F 0xFFFF 0x7FFF 0x8000 0x1234 0xEDCB
#     -> 0xFFFF 0xFFFF 0xFFFF 0xF0F0 0xF2F4 0xFDFB
#   int32, constant 0x0F0F0F0F:
#     0x0F0F0F0F 0xFFFFFFFF 0x7FFFFFFF 0x80000000 0x12345678 0xEDCBA987
#     -> 0x0F0F0F0F 0xFFFFFFFF 0x7FFFFFFF 0x8F0F0F0F 0x1F3F5F7F 0xEFCFAF8F
#   int32, constant 0xF0F0F0F0:
#     0x0F0F0F0F 0xFFFFFFFF 0x7FFFFFFF 0x80000000 0x12345678 0xEDCBA987
#     -> 0xFFFFFFFF 0xFFFFFFFF 0xFFFFFFFF 0xF0F0F0F0 0xF2F4F6F8 0xFDFBF9F7
blocks:
  - id: gr::blocks::testing::VectorSource<uint8>
    parameters:
      name: source0_u8
      values: [15, 240, 255, 0, 165, 90]
  - id: gr::blocks::math::OrConst<uint8>
    parameters:
      name: or_const0_u8
      constant: 15
  - id: gr::blocks::testing::ExpectSink<uint8>
    parameters:
      name: sink0_u8
      expected: [15, 255, 255, 15, 175, 95]
  - id: gr::blocks::testing::VectorSource<uint8>
