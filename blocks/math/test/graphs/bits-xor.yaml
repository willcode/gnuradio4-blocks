# Xor: out = the bitwise exclusive OR of all inputs, with two inputs (n_inputs 2) and three (n_inputs 3).
#   uint8, 2 inputs:
#     a 0x0F 0xF0 0xFF 0x00 0xA5
#     b 0xFF 0x3C 0x0F 0xFF 0x5A
#     a ^ b -> 0xF0 0xCC 0xF0 0xFF 0xFF
#   uint8, 3 inputs:
#     a 0x0F 0xF0 0xFF 0x00 0xA5
#     b 0xFF 0x3C 0x0F 0xFF 0x5A
#     c 0x33 0xFF 0xF0 0x00 0xFF
#     a ^ b ^ c -> 0xC3 0x33 0x00 0xFF 0x00
#   int16, 2 inputs:
#     a 0x0F0F 0xFFFF 0x7FFF 0x8000 0x1234
#     b 0x00FF 0x5555 0xFFFF 0x7FFF 0xEDCB
#     a ^ b -> 0x0FF0 0xAAAA 0x8000 0xFFFF 0xFFFF
#   int16, 3 inputs:
#     a 0x0F0F 0xFFFF 0x7FFF 0x8000 0x1234
#     b 0x00FF 0x5555 0xFFFF 0x7FFF 0xEDCB
#     c 0x3333 0xF0F0 0x0F0F 0x8000 0xFFFF
#     a ^ b ^ c -> 0x3CC3 0x5A5A 0x8F0F 0x7FFF 0x0000
#   int32, 2 inputs:
#     a 0x0F0F0F0F 0xFFFFFFFF 0x7FFFFFFF 0x80000000 0x12345678
#     b 0x0000FFFF 0x55555555 0xFFFFFFFF 0x7FFFFFFF 0xEDCBA987
#     a ^ b -> 0x0F0FF0F0 0xAAAAAAAA 0x80000000 0xFFFFFFFF 0xFFFFFFFF
#   int32, 3 inputs:
#     a 0x0F0F0F0F 0xFFFFFFFF 0x7FFFFFFF 0x80000000 0x12345678
#     b 0x0000FFFF 0x55555555 0xFFFFFFFF 0x7FFFFFFF 0xEDCBA987
#     c 0x33333333 0xF0F0F0F0 0x0F0F0F0F 0x80000000 0xFFFFFFFF
#     a ^ b ^ c -> 0x3C3CC3C3 0x5A5A5A5A 0x8F0F0F0F 0x7FFFFFFF 0x00000000
