# XorConst: out = in ^ constant, with constant 0x0F and 0xF0 repeated over the width of the type.
#   the values in hex, as the bits of the type; the lists hold the same values in decimal.
#   uint8, constant 0x0F:
#     0x0F 0xF0 0xFF 0x00 0xA5 0x5A
#     -> 0x00 0xFF 0xF0 0x0F 0xAA 0x55
#   uint8, constant 0xF0:
#     0x0F 0xF0 0xFF 0x00 0xA5 0x5A
#     -> 0xFF 0x00 0x0F 0xF0 0x55 0xAA
#   int16, constant 0x0F0F:
#     0x0F0F 0xFFFF 0x7FFF 0x8000 0x1234 0xEDCB
#     -> 0x0000 0xF0F0 0x70F0 0x8F0F 0x1D3B 0xE2C4
#   int16, constant 0xF0F0:
#     0x0F0F 0xFFFF 0x7FFF 0x8000 0x1234 0xEDCB
#     -> 0xFFFF 0x0F0F 0x8F0F 0x70F0 0xE2C4 0x1D3B
#   int32, constant 0x0F0F0F0F:
#     0x0F0F0F0F 0xFFFFFFFF 0x7FFFFFFF 0x80000000 0x12345678 0xEDCBA987
#     -> 0x00000000 0xF0F0F0F0 0x70F0F0F0 0x8F0F0F0F 0x1D3B5977 0xE2C4A688
#   int32, constant 0xF0F0F0F0:
#     0x0F0F0F0F 0xFFFFFFFF 0x7FFFFFFF 0x80000000 0x12345678 0xEDCBA987
#     -> 0xFFFFFFFF 0x0F0F0F0F 0x8F0F0F0F 0x70F0F0F0 0xE2C4A688 0x1D3B5977
blocks:
  - id: gr::blocks::testing::VectorSource<uint8>
    parameters:
      name: source0_u8
