  - id: gr::blocks::math::XorConst<uint8>
    parameters:
      name: xor_const0_u8
      constant: 15
  - id: gr::blocks::testing::ExpectSink<uint8>
    parameters:
      name: sink0_u8
      expected: [0, 255, 240, 15, 170, 85]
  - id: gr::blocks::testing::VectorSource<uint8>
